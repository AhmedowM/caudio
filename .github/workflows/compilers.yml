# Compiler version matrix (MANUAL observatory, not a gate).
#
# Probes which compiler versions build + pass the suite, to confirm
# version floors instead of guessing.
#
# - Version selection works through PATH (toolchains hard-set bare names);
#   each job plants versioned symlinks where they win.
# - Legs are informational (continue-on-error) with a summary in `report`.
# - No macOS legs here (macOS is covered by the release-bakeoff apple legs).

name: Compilers (manual)

"on":
  workflow_dispatch:
    inputs:
      gcc_versions:
        description: 'GCC majors on ubuntu-24.04 (JSON array)'
        required: false
        default: '["13", "14", "15"]'
      clang_versions:
        description: 'LLVM majors on ubuntu-24.04 via apt.llvm.org (JSON array)'
        required: false
        default: '["19", "20", "21"]'
      run_msvc:
        description: 'Run MSVC legs (windows-2022 + windows-latest)'
        type: boolean
        default: true
      run_winclang:
        description: 'Run LLVM clang++ on Windows leg (MSVC ABI)'
        type: boolean
        default: true
      strict:
        description: 'Fail the run on any version finding (Tier-1 qualification mode)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gcc:
    name: gcc-${{ matrix.version }} (ubuntu-24.04)
    runs-on: ubuntu-24.04
    continue-on-error: ${{ inputs.strict == false }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.gcc_versions) }}
    env:
      CAUDIO_TEST_NOAUDIO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GCC ${{ matrix.version }}
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.version }} g++-${{ matrix.version }}
          # toolchain-gcc.cmake resolves bare `gcc`/`g++` from PATH, so point
          # the unversioned names at this leg's version (CI precedent).
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ matrix.version }} 100 --slave /usr/bin/g++ g++ /usr/bin/g++-${{ matrix.version }} --slave /usr/bin/gcov gcov /usr/bin/gcov-${{ matrix.version }} || true
          sudo update-alternatives --set gcc /usr/bin/gcc-${{ matrix.version }} || true
          gcc --version; g++ --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev graphviz
          cmake --version
          ninja --version

      - name: Configure (ci-gcc)
        run: cmake --preset ci-gcc

      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset ci-gcc 2>&1 | tee build-gcc-${{ matrix.version }}.log

      - name: Test
        run: |
          set -o pipefail
          ctest --preset ci-gcc --output-on-failure 2>&1 | tee test-gcc-${{ matrix.version }}.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilers-gcc-${{ matrix.version }}-logs
          path: |
            build-gcc-${{ matrix.version }}.log
            test-gcc-${{ matrix.version }}.log
          if-no-files-found: warn

  clang:
    name: clang-${{ matrix.version }} (ubuntu-24.04)
    runs-on: ubuntu-24.04
    continue-on-error: ${{ inputs.strict == false }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.clang_versions) }}
    env:
      CAUDIO_TEST_NOAUDIO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LLVM Clang ${{ matrix.version }} (apt.llvm.org)
        run: |
          # Needs lsb-release/wget/gnupg; signed-by keyring (never apt-key);
          # apt update after adding the source. Keep in sync with release.yml / release-bakeoff.yml.
          sudo apt-get update
          sudo apt-get install -y lsb-release wget gnupg
          CODENAME="$(lsb_release -cs)"
          echo "codename: $CODENAME"
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt-llvm-org.asc > /dev/null
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${{ matrix.version }} main" | sudo tee /etc/apt/sources.list.d/llvm-${{ matrix.version }}.list
          for i in 1 2 3; do sudo apt-get update && break || sleep 10; done
          sudo apt-get install -y clang-${{ matrix.version }}
          /usr/bin/clang-${{ matrix.version }} --version
          # toolchain-clang.cmake resolves bare `clang` from PATH, so plant
          # winning symlinks (same mechanism as the GCC alternatives above).
          sudo ln -sf /usr/bin/clang-${{ matrix.version }} /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-${{ matrix.version }} /usr/local/bin/clang++
          hash -r; clang --version; clang++ --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev graphviz
          cmake --version
          ninja --version

      - name: Configure (ci-clang)
        run: cmake --preset ci-clang

      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset ci-clang 2>&1 | tee build-clang-${{ matrix.version }}.log

      - name: Test
        run: |
          set -o pipefail
          ctest --preset ci-clang --output-on-failure 2>&1 | tee test-clang-${{ matrix.version }}.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilers-clang-${{ matrix.version }}-logs
          path: |
            build-clang-${{ matrix.version }}.log
            test-clang-${{ matrix.version }}.log
          if-no-files-found: warn

  msvc:
    name: msvc (${{ matrix.os }})
    if: inputs.run_msvc
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ inputs.strict == false }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    env:
      CAUDIO_TEST_NOAUDIO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: MSVC version under test
        run: |
          # No version pin: the two images ship different VS generations, so
          # the pair probes the floor (2022) and the ceiling (latest).
          vswhere -latest -property installationVersion || echo "vswhere unavailable"
          cl 2>&1 | head -n 2 || true
        shell: bash

      - name: Install dependencies
        run: |
          choco install ninja -y --no-progress || echo "ninja choco install failed"
          choco install ffmpeg -y --no-progress || echo "ffmpeg choco install failed, will use SetupFFmpeg fallback"
          cmake --version
          ninja --version
          ffmpeg -version || echo "ffmpeg not on PATH, relying on SetupFFmpeg fallback"
        shell: bash

      - name: Configure (ci-msvc)
        # ci-msvc pins the VS 2026 generator, which windows-2022 (VS17 max)
        # cannot create -- fall back to VS17 there. The older toolset is
        # precisely what this leg probes (C++23 gaps welcome: findings).
        run: |
          GEN_ARGS=()
          if [ "${{ matrix.os }}" = "windows-2022" ]; then GEN_ARGS=(-G "Visual Studio 17 2022"); fi
          cmake --preset ci-msvc "${GEN_ARGS[@]}"
        shell: bash

      - name: Expose DLLs
        run: |
          # Same hermeticity rationale as ci.yml: loader needs the FFmpeg
          # DLLs on PATH (absolute Windows dirs via cygpath -w).
          dll=$(find build/ci-msvc/_deps -name 'avcodec-*.dll' | head -n 1)
          if [ -z "$dll" ]; then
            fdir="$(dirname "$(command -v ffmpeg)")"
            dll=$(find "$fdir" -maxdepth 1 -name 'avcodec-*.dll' | head -n 1)
          fi
          test -n "$dll" || (echo "FFmpeg DLLs not found" && exit 1)
          cygpath -w "$(cd "$(dirname "$dll")" && pwd)" >> $GITHUB_PATH
        shell: bash

      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset ci-msvc 2>&1 | tee build-msvc-${{ matrix.os }}.log
        shell: bash

      - name: Test
        run: |
          set -o pipefail
          ctest --preset ci-msvc --output-on-failure 2>&1 | tee test-msvc-${{ matrix.os }}.log
        shell: bash

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilers-msvc-${{ matrix.os }}-logs
          path: |
            build-msvc-${{ matrix.os }}.log
            test-msvc-${{ matrix.os }}.log
          if-no-files-found: warn

  winclang:
    name: clang++ on Windows (MSVC ABI)
    if: inputs.run_winclang
    runs-on: windows-latest
    continue-on-error: ${{ inputs.strict == false }}
    env:
      CAUDIO_TEST_NOAUDIO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LLVM
        run: |
          choco install llvm -y --no-progress || echo "llvm choco install failed"
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          echo "/c/Program Files/LLVM/bin" >> $GITHUB_PATH
          clang++ --version || exit 1
        shell: bash

      - name: Install dependencies
        run: |
          choco install ninja -y --no-progress || echo "ninja choco install failed"
          choco install ffmpeg -y --no-progress || echo "ffmpeg choco install failed, will use SetupFFmpeg fallback"
          cmake --version
          ninja --version
        shell: bash

      - name: Configure (ci preset, auto toolchain finds clang++)
        # toolchain-auto prefers clang++ from PATH on Windows (MSVC ABI,
        # verified locally); lld-link consumes the same .dll.a FFmpeg
        # import libs as the MinGW builds.
        run: cmake --preset ci

      - name: Expose DLLs
        run: |
          dll=$(find build/ci/_deps -name 'avcodec-*.dll' | head -n 1)
          if [ -z "$dll" ]; then
            fdir="$(dirname "$(command -v ffmpeg)")"
            dll=$(find "$fdir" -maxdepth 1 -name 'avcodec-*.dll' | head -n 1)
          fi
          test -n "$dll" || (echo "FFmpeg DLLs not found" && exit 1)
          cygpath -w "$(cd "$(dirname "$dll")" && pwd)" >> $GITHUB_PATH
        shell: bash

      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset ci 2>&1 | tee build-winclang.log
        shell: bash

      - name: Test
        run: |
          set -o pipefail
          ctest --preset ci --output-on-failure 2>&1 | tee test-winclang.log
        shell: bash

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilers-winclang-logs
          path: |
            build-winclang.log
            test-winclang.log
          if-no-files-found: warn

  report:
    name: version support report
    needs: [gcc, clang, msvc, winclang]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        run: |
          {
            echo "# Compiler version support (manual run)"
            echo ""
            echo "| Leg | Result |"
            echo "| --- | ------ |"
            echo "| gcc matrix | ${{ needs.gcc.result }} |"
            echo "| clang matrix | ${{ needs.clang.result }} |"
            echo "| msvc | ${{ needs.msvc.result }} |"
            echo "| winclang | ${{ needs.winclang.result }} |"
            echo ""
            echo "Per-version logs are in the run artifacts. A red leg is a"
            echo "finding (floor/ceiling gap or regression), not necessarily"
            echo "a product bug -- check the log, then either polyfill in-tree"
            echo "(see utils/function.hpp precedent), bump the floor in"
            echo "AGENTS.md + CompilerPolicy.cmake, or file a work item."
            echo "Re-run with strict=true once a version is Tier-1 candidate."
          } >> "$GITHUB_STEP_SUMMARY"
