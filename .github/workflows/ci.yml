name: CI

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    env:
      CAUDIO_TEST_NOAUDIO: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        include:
          - os: ubuntu-24.04
            compiler: gcc-16
            cc: gcc-16
            cxx: g++-16
          - os: macos-14
            compiler: gcc-16
            cc: gcc-16
            cxx: g++-16
          - os: windows-2022
            compiler: gcc-16
            cc: C:/msys64/ucrt64/bin/gcc.exe
            cxx: C:/msys64/ucrt64/bin/g++.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC 16 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version
          g++-16 --version
          # also make gcc/g++ point to 16 for tools that call plain gcc
          sudo update-alternatives --set gcc /usr/bin/gcc-16 || true
          gcc --version; g++ --version

      - name: Setup GCC 16 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install gcc@16 || brew install gcc
          # Homebrew installs versioned binaries without shadowing system clang
          for b in /opt/homebrew/bin/g++-16 /usr/local/bin/g++-16 /opt/homebrew/bin/gcc-16 /usr/local/bin/gcc-16; do
            if [ -x "$b" ]; then echo "found $b"; "$b" --version; fi
          done
          gcc-16 --version || g++-16 --version || gcc --version
          g++-16 --version

      - name: Setup GCC 16 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils

      - name: Add MinGW to PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "C:\msys64\ucrt64\bin" >> $GITHUB_PATH
        shell: bash

      - name: Add MinGW to PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "C:\msys64\ucrt64\bin" >> $GITHUB_PATH
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        shell: bash

      - name: Verify GCC 16 (Windows)
        if: runner.os == 'Windows'
        run: |
          which gcc || echo "gcc not found in PATH"
          gcc --version
          which g++ || echo "g++ not found in PATH"
          g++ --version
        shell: bash

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev graphviz
          ffmpeg -version || true
          cmake --version
          ninja --version

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja ffmpeg graphviz || brew upgrade ninja ffmpeg graphviz || true
          ffmpeg -version || true
          cmake --version
          ninja --version

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y --no-progress || echo "ninja choco install failed"
          # FFmpeg via system or SetupFFmpeg fallback — no hard fail if not found, but tests need it
          # Try choco ffmpeg as best-effort; fallback cmake/SetupFFmpeg.cmake will fetch prebuilt if needed
          choco install ffmpeg -y --no-progress || echo "ffmpeg choco install failed, will use SetupFFmpeg fallback"
          cmake --version
          ninja --version
          ffmpeg -version || echo "ffmpeg not on PATH, relying on SetupFFmpeg fallback"

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -B build -G Ninja -DCAUDIO_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build build -j4

      - name: Test
        env:
          CAUDIO_TEST_NOAUDIO: 1
        run: ctest --test-dir build --output-on-failure -j4

      - name: Docs
        run: cmake --build build --target doc || echo "Doxygen not found or doc target unavailable — skipping"

      - name: Package (TGZ)
        run: |
          cpack --config build/CPackConfig.cmake -G TGZ || cpack -G TGZ --config build/CPackConfig.cmake || (cd build && cpack -G TGZ) || echo "CPack TGZ failed"
        shell: bash

      - name: Upload artifact - package
        uses: actions/upload-artifact@v4
        with:
          name: caudio-package-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/*.tar.gz
          if-no-files-found: warn

      - name: Upload artifact - docs
        uses: actions/upload-artifact@v4
        with:
          name: caudio-docs-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/docs/html
          if-no-files-found: warn

  sanitizers:
    name: sanitizers (ubuntu-24.04 / gcc-16)
    runs-on: ubuntu-24.04
    env:
      CAUDIO_TEST_NOAUDIO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC 16
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version; g++-16 --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev
          ffmpeg -version || true
          cmake --version
          ninja --version

      - name: Configure (ASan+UBSan)
        env:
          CC: gcc-16
          CXX: g++-16
        run: cmake -B build -G Ninja -DCAUDIO_ENABLE_TESTS=ON -DCAUDIO_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build -j4

      - name: Test
        env:
          CAUDIO_TEST_NOAUDIO: 1
        run: ctest --test-dir build --output-on-failure -j4

  install-smoke:
    name: install-smoke (ubuntu-24.04 / gcc-16)
    runs-on: ubuntu-24.04
    env:
      CAUDIO_TEST_NOAUDIO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC 16
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version; g++-16 --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev graphviz
          cmake --version
          ninja --version

      - name: Configure
        env:
          CC: gcc-16
          CXX: g++-16
        run: cmake -B build -G Ninja -DCAUDIO_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build build -j4

      - name: Test
        env:
          CAUDIO_TEST_NOAUDIO: 1
        run: ctest --test-dir build --output-on-failure -j4

      - name: Install to /tmp/caudio-install
        run: cmake --install build --prefix /tmp/caudio-install

      - name: Verify install layout
        run: |
          echo "=== install tree ==="
          find /tmp/caudio-install -type f | head -n 100
          echo "=== caudio --version ==="
          /tmp/caudio-install/bin/caudio --version || build/caudio --version || echo "caudio --version check failed"
          echo "=== version.hpp ==="
          test -f /tmp/caudio-install/include/caudio/version.hpp && echo "version.hpp found" || (echo "version.hpp missing" && exit 1)
          echo "=== module sources shipped ==="
          ls -R /tmp/caudio-install/include/caudio/src | head -n 100
          test -f /tmp/caudio-install/include/caudio/src/caudio.cppm && echo "caudio.cppm found" || (echo "caudio.cppm missing" && exit 1)
          ls /tmp/caudio-install/include/caudio/src/*.cppm | head -n 20
          test -f /tmp/caudio-install/lib/cmake/caudio/caudioConfig.cmake && echo "caudioConfig.cmake found" || echo "caudioConfig.cmake missing"

      - name: Smoke compile (find_package + import caudio)
        run: |
          mkdir -p /tmp/caudio-smoke
          cat > /tmp/caudio-smoke/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(caudio_smoke CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          list(APPEND CMAKE_PREFIX_PATH "/tmp/caudio-install")
          find_package(caudio CONFIG REQUIRED)
          add_executable(smoke main.cpp)
          target_link_libraries(smoke PRIVATE caudio::utils)
          EOF
          cat > /tmp/caudio-smoke/main.cpp << 'EOF'
          import caudio;
          #include <print>
          int main() {
            std::println("caudio smoke ok: {}", caudio::kVersion);
            return 0;
          }
          EOF
          cmake -B /tmp/caudio-smoke/build -G Ninja -DCMAKE_PREFIX_PATH=/tmp/caudio-install -DCMAKE_CXX_STANDARD=23 /tmp/caudio-smoke
          cmake --build /tmp/caudio-smoke/build -v
          /tmp/caudio-smoke/build/smoke || ./tmp/caudio-smoke/build/smoke
