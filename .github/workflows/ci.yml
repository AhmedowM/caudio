name: CI

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    env:
      CAUDIO_TEST_NOAUDIO: 1
    strategy:
      fail-fast: false
      matrix:
        # NOTE: ubuntu-latest is 24.04 today but migrates to 26.04 in Nov 2026
        # (new kernel/CMake/FFmpeg, PPA gcc-16 support TBD) -- re-validate then.
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            compiler: gcc-16
            cc: gcc-16
            cxx: g++-16
          - os: macos-latest
            compiler: gcc-16
            cc: gcc-16
            cxx: g++-16
          - os: windows-latest
            compiler: gcc-16
            cc: gcc
            cxx: g++
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check VERSION matches latest tag
        run: |
          tag="$(git describe --tags --abbrev=0 2>/dev/null | tr -d v)" || { echo "no tags in clone -- skipping VERSION check"; exit 0; }
          ver="$(tr -d 'v \n\r' < VERSION)"
          test "$ver" = "$tag" || (echo "VERSION file ($ver) drifted from latest tag ($tag) -- bump VERSION in the release-prep commit" && exit 1)
        shell: bash

      - name: Setup GCC (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version
          g++-16 --version
          # also make gcc/g++ point to 16 for tools that call plain gcc
          sudo update-alternatives --set gcc /usr/bin/gcc-16 || true
          gcc --version; g++ --version

      - name: Setup GCC (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install gcc@16 || brew install gcc
          # Homebrew installs versioned binaries without shadowing system clang
          for b in /opt/homebrew/bin/g++-16 /usr/local/bin/g++-16 /opt/homebrew/bin/gcc-16 /usr/local/bin/gcc-16; do
            if [ -x "$b" ]; then echo "found $b"; "$b" --version; fi
          done
          gcc-16 --version || g++-16 --version || gcc --version
          g++-16 --version

      - name: Setup GCC (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils

      - name: Add MinGW to PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          # setup-msys2 installs under RUNNER_TEMP, not C:/msys64: resolve via
          # the action's msys2-location output.
          echo "${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin" >> $GITHUB_PATH
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        shell: bash

      - name: Verify GCC 16 (Windows)
        if: runner.os == 'Windows'
        run: |
          command -v gcc || (echo "gcc not on PATH after msys2 setup" && exit 1)
          command -v g++ || (echo "g++ not on PATH after msys2 setup" && exit 1)
          gcc --version || exit 1
          g++ --version || exit 1
        shell: bash

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev graphviz
          ffmpeg -version || true
          cmake --version
          ninja --version

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # ninja + ffmpeg only: graphviz (Doxygen dot) is unused in CI and
          # its bottle (svn dependency) is slow and flaky.
          brew install ninja ffmpeg || brew upgrade ninja ffmpeg || true
          ffmpeg -version || true
          cmake --version
          ninja --version

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y --no-progress || echo "ninja choco install failed"
          # FFmpeg via system or SetupFFmpeg fallback -- no hard fail if not found, but tests need it
          # Try choco ffmpeg as best-effort; fallback cmake/SetupFFmpeg.cmake will fetch prebuilt if needed
          choco install ffmpeg -y --no-progress || echo "ffmpeg choco install failed, will use SetupFFmpeg fallback"
          cmake --version
          ninja --version
          ffmpeg -version || echo "ffmpeg not on PATH, relying on SetupFFmpeg fallback"

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ci

      - name: Expose DLLs (Windows)
        if: runner.os == 'Windows'
        run: |
          # Test executables run at build time (Catch2 discovery) and test
          # time. The loader needs FFmpeg DLLs AND the toolchain runtime
          # (libstdc++-6.dll etc.); neither is on PATH by default.
          # 0xc0000135 == STATUS_DLL_NOT_FOUND.
          # NOTE: the Windows loader needs ABSOLUTE Windows-style dirs.
          # Relative entries resolve against each process CWD (useless) and
          # Git-Bash POSIX paths (/d/...) are unreadable to it -- always
          # convert with cygpath -w.
          dll=$(find build/ci/_deps -name 'avcodec-*.dll' | head -n 1)
          test -n "$dll" || (echo "FFmpeg DLLs not found under build/ci/_deps" && exit 1)
          cygpath -w "$(cd "$(dirname "$dll")" && pwd)" >> $GITHUB_PATH
          cygpath -w "$(dirname "$(command -v g++)")" >> $GITHUB_PATH
          echo "PATH additions:"; tail -n 2 "$GITHUB_PATH"
        shell: bash

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        env:
          CAUDIO_TEST_NOAUDIO: 1
        run: ctest --preset ci

      - name: Package (TGZ)
        run: |
          cpack --config build/ci/CPackConfig.cmake -G TGZ || cpack -G TGZ --config build/ci/CPackConfig.cmake || (cd build/ci && cpack -G TGZ) || echo "CPack TGZ failed"
        shell: bash

      - name: Upload artifact - package
        uses: actions/upload-artifact@v4
        with:
          name: caudio-package-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/ci/*.tar.gz
          if-no-files-found: warn

      - name: Upload artifact - docs
        uses: actions/upload-artifact@v4
        with:
          name: caudio-docs-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/ci/docs/html
          if-no-files-found: warn

  sanitizers:
    name: sanitizers (ubuntu-24.04 / gcc-16)
    runs-on: ubuntu-latest
    env:
      CAUDIO_TEST_NOAUDIO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version; g++-16 --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev
          ffmpeg -version || true
          cmake --version
          ninja --version

      - name: Configure (ASan+UBSan)
        env:
          CC: gcc-16
          CXX: g++-16
        run: cmake --preset ci-sanitizers

      - name: Build
        run: cmake --build --preset ci-sanitizers

      - name: Test
        env:
          CAUDIO_TEST_NOAUDIO: 1
          # Known FFmpeg probe-buffer drip suppressed (see file); all other
          # leaks, UBSan and ASan reports stay fatal. NOTE: env blocks need
          # ${{ }} context syntax -- $VAR is NOT expanded here.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizers/lsan.supp:report_objects=1
        run: ctest --preset ci-sanitizers

  install-smoke:
    name: install-smoke (ubuntu-24.04 / gcc-16)
    runs-on: ubuntu-latest
    env:
      CAUDIO_TEST_NOAUDIO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version; g++-16 --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev graphviz
          cmake --version
          ninja --version

      - name: Configure
        env:
          CC: gcc-16
          CXX: g++-16
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        env:
          CAUDIO_TEST_NOAUDIO: 1
        run: ctest --preset ci

      - name: Install to /tmp/caudio-install
        run: cmake --install build/ci --prefix /tmp/caudio-install

      - name: Verify install layout
        run: |
          echo "=== install tree ==="
          find /tmp/caudio-install -type f | head -n 100
          echo "=== caudio --version ==="
          /tmp/caudio-install/bin/caudio --version || build/ci/caudio --version || echo "caudio --version check failed"
          echo "=== version.hpp ==="
          test -f /tmp/caudio-install/include/caudio/version.hpp && echo "version.hpp found" || (echo "version.hpp missing" && exit 1)
          echo "=== no module sources in header-mode install ==="
          test ! -d /tmp/caudio-install/include/caudio/src && echo "no src/*.cppm (expected, modules OFF)" || (echo "unexpected src/*.cppm shipped" && exit 1)
          test -f /tmp/caudio-install/lib/cmake/caudio/caudioConfig.cmake && echo "caudioConfig.cmake found" || echo "caudioConfig.cmake missing"
          test -f /tmp/caudio-install/lib/cmake/caudio/FindFFmpeg.cmake && echo "FindFFmpeg.cmake found" || (echo "FindFFmpeg.cmake missing" && exit 1)
          test -f /tmp/caudio-install/include/caudio/version_config.hpp && echo "version_config.hpp found" || (echo "version_config.hpp missing" && exit 1)

      - name: Smoke compile (find_package + headers)
        run: |
          mkdir -p /tmp/caudio-smoke
          cat > /tmp/caudio-smoke/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(caudio_smoke CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          list(APPEND CMAKE_PREFIX_PATH "/tmp/caudio-install")
          find_package(caudio CONFIG REQUIRED)
          add_executable(smoke main.cpp)
          target_link_libraries(smoke PRIVATE caudio::utils)
          EOF
          cat > /tmp/caudio-smoke/main.cpp << 'EOF'
          #include <caudio/utils.hpp>
          #include <print>
          int main() {
            std::println("caudio smoke ok: {}", caudio::shortVersion);
            return 0;
          }
          EOF
          cmake -B /tmp/caudio-smoke/build -G Ninja -DCMAKE_PREFIX_PATH=/tmp/caudio-install -DCMAKE_CXX_STANDARD=23 /tmp/caudio-smoke
          cmake --build /tmp/caudio-smoke/build -v
          /tmp/caudio-smoke/build/smoke || ./tmp/caudio-smoke/build/smoke

  modules-smoke:
    name: modules-smoke (ubuntu-24.04 / gcc-16)
    runs-on: ubuntu-latest
    env:
      CAUDIO_TEST_NOAUDIO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version; g++-16 --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev
          cmake --version
          ninja --version

      - name: Configure (modules ON)
        env:
          CC: gcc-16
          CXX: g++-16
        run: cmake --preset modules

      - name: Build
        run: cmake --build --preset modules

      - name: Install to /tmp/caudio-install-mod
        run: cmake --install build/modules --prefix /tmp/caudio-install-mod

      - name: Verify module sources shipped
        run: |
          test -f /tmp/caudio-install-mod/include/caudio/modules/caudio.cppm && echo "caudio.cppm found" || (echo "caudio.cppm missing" && exit 1)
          ls /tmp/caudio-install-mod/include/caudio/modules/*/*.cppm | head -n 20

      - name: Smoke compile (find_package + import caudio.utils)
        run: |
          mkdir -p /tmp/caudio-mod-smoke
          # Correct consumption: link caudio::utils (which carries its own
          # installed CXX_MODULES file set) and import the module. Do NOT list
          # the installed .cppm files in our own FILE_SET -- that compiles the
          # same module names twice and CMake aborts with "Disagreement of the
          # location of the 'caudio.utils' module".
          cat > /tmp/caudio-mod-smoke/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(caudio_mod_smoke CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_SCAN_FOR_MODULES ON)
          list(APPEND CMAKE_PREFIX_PATH "/tmp/caudio-install-mod")
          find_package(caudio CONFIG REQUIRED)
          add_executable(smoke main.cpp)
          target_compile_features(smoke PRIVATE cxx_std_23)
          target_link_libraries(smoke PRIVATE caudio::utils)
          EOF
          cat > /tmp/caudio-mod-smoke/main.cpp << 'EOF'
          #include <print>
          import caudio.utils;
          int main() {
            std::println("caudio module smoke ok: {}", caudio::utils::shortVersion());
            return 0;
          }
          EOF
          cmake -B /tmp/caudio-mod-smoke/build -G Ninja -DCMAKE_PREFIX_PATH=/tmp/caudio-install-mod -DCMAKE_CXX_STANDARD=23 /tmp/caudio-mod-smoke
          cmake --build /tmp/caudio-mod-smoke/build -v
          /tmp/caudio-mod-smoke/build/smoke
