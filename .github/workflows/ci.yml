name: CI

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    env:
      CAUDIO_TEST_NOAUDIO: 1
    strategy:
      fail-fast: false
      matrix:
        # NOTE: ubuntu-latest is 24.04 today but migrates to 26.04 in Nov 2026
        # (new kernel/CMake/FFmpeg, PPA gcc-16 support TBD) -- re-validate then.
        # Compiler lives in the preset (ci-gcc/ci-clang/ci-msvc); `compiler`
        # below is display + artifact naming only. macOS is LLVM Clang --
        # GCC builds miniaudio with the dummy backend (no audio).
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            compiler: gcc-16
            preset: ci-gcc
          - os: macos-latest
            compiler: clang
            preset: ci-clang
          - os: windows-latest
            compiler: windows-gcc
            preset: ci-gcc
          - os: windows-latest
            compiler: msvc
            preset: ci-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check VERSION matches latest tag
        run: |
          tag="$(git describe --tags --abbrev=0 2>/dev/null | tr -d v)" || { echo "no tags in clone -- skipping VERSION check"; exit 0; }
          ver="$(tr -d 'v \n\r' < VERSION)"
          test "$ver" = "$tag" || (echo "VERSION file ($ver) drifted from latest tag ($tag) -- bump VERSION in the release-prep commit" && exit 1)
        shell: bash

      - name: Setup GCC (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version
          g++-16 --version
          # also make gcc/g++ point to 16 for tools that call plain gcc
          sudo update-alternatives --set gcc /usr/bin/gcc-16 || true
          gcc --version; g++ --version

      - name: Setup LLVM Clang (macOS)
        if: runner.os == 'macOS'
        run: |
          # Policy: LLVM Clang only on Apple (brew `llvm` is keg-only, so it
          # never shadows system clang -- the toolchain resolves
          # "$(brew --prefix llvm)/bin/clang" explicitly). GCC builds
          # miniaudio with the dummy backend (no audio); AppleClang lags
          # our C++23 baseline. Both are fatal at configure time.
          brew update || echo "brew update failed, continuing with snapshot"
          brew install llvm || brew upgrade llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH
          "$LLVM_PREFIX/bin/clang" --version
          "$LLVM_PREFIX/bin/clang++" --version
          LLVM_MAJOR="$("$LLVM_PREFIX/bin/clang" -dumpversion | cut -d. -f1)"
          test "$LLVM_MAJOR" -ge 20 || (echo "brew LLVM too old for our C++23 baseline (<expected>, <print>): $LLVM_MAJOR" && exit 1)

      - name: Setup GCC (Windows)
        if: runner.os == 'Windows' && matrix.compiler == 'windows-gcc'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils

      - name: Add MinGW to PATH (Windows)
        if: runner.os == 'Windows' && matrix.compiler == 'windows-gcc'
        run: |
          # setup-msys2 installs under RUNNER_TEMP, not C:/msys64: resolve via
          # the action's msys2-location output.
          echo "${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin" >> $GITHUB_PATH
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        shell: bash

      - name: Verify GCC 16 (Windows)
        if: runner.os == 'Windows' && matrix.compiler == 'windows-gcc'
        run: |
          command -v gcc || (echo "gcc not on PATH after msys2 setup" && exit 1)
          command -v g++ || (echo "g++ not on PATH after msys2 setup" && exit 1)
          gcc --version || exit 1
          g++ --version || exit 1
        shell: bash

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev graphviz
          ffmpeg -version || true
          cmake --version
          ninja --version

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # ninja + ffmpeg only: graphviz (Doxygen dot) is unused in CI and
          # its bottle (svn dependency) is slow and flaky.
          brew install ninja ffmpeg || brew upgrade ninja ffmpeg || true
          ffmpeg -version || true
          cmake --version
          ninja --version

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y --no-progress || echo "ninja choco install failed"
          # FFmpeg via system or SetupFFmpeg fallback -- no hard fail if not found, but tests need it
          # Try choco ffmpeg as best-effort; fallback cmake/SetupFFmpeg.cmake will fetch prebuilt if needed
          choco install ffmpeg -y --no-progress || echo "ffmpeg choco install failed, will use SetupFFmpeg fallback"
          cmake --version
          ninja --version
          ffmpeg -version || echo "ffmpeg not on PATH, relying on SetupFFmpeg fallback"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Expose DLLs (Windows)
        if: runner.os == 'Windows'
        run: |
          # Test executables run at build time (Catch2 discovery) and test
          # time. The loader needs FFmpeg DLLs AND, for MinGW, the toolchain
          # runtime (libstdc++-6.dll etc.); neither is on PATH by default.
          # 0xc0000135 == STATUS_DLL_NOT_FOUND. (MSVC links the system UCRT.)
          # NOTE: the Windows loader needs ABSOLUTE Windows-style dirs.
          # Relative entries resolve against each process CWD (useless) and
          # Git-Bash POSIX paths (/d/...) are unreadable to it -- always
          # convert with cygpath -w.
          dll=$(find build/${{ matrix.preset }}/_deps -name 'avcodec-*.dll' | head -n 1)
          if [ -z "$dll" ]; then
            # System FFmpeg (e.g. choco): DLLs sit next to ffmpeg.exe itself.
            fdir="$(dirname "$(command -v ffmpeg)")"
            dll=$(find "$fdir" -maxdepth 1 -name 'avcodec-*.dll' | head -n 1)
          fi
          test -n "$dll" || (echo "FFmpeg DLLs not found" && exit 1)
          cygpath -w "$(cd "$(dirname "$dll")" && pwd)" >> $GITHUB_PATH
          if [ "${{ matrix.compiler }}" = "windows-gcc" ]; then
            cygpath -w "$(dirname "$(command -v g++)")" >> $GITHUB_PATH
          fi
          echo "PATH additions:"; tail -n 2 "$GITHUB_PATH"
        shell: bash

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        env:
          CAUDIO_TEST_NOAUDIO: 1
        run: ctest --preset ${{ matrix.preset }}

      - name: Package (TGZ)
        if: matrix.compiler != 'msvc'
        run: |
          cpack --config build/${{ matrix.preset }}/CPackConfig.cmake -G "TGZ;ZIP" || (cd build/${{ matrix.preset }} && cpack -G "TGZ;ZIP") || echo "CPack TGZ failed"
        shell: bash

      - name: Package (TGZ, MSVC config)
        if: matrix.compiler == 'msvc'
        run: |
          # Multi-config generator: -C selects which built config to package.
          cpack -C Debug --config build/${{ matrix.preset }}/CPackConfig.cmake -G "TGZ;ZIP" || (cd build/${{ matrix.preset }} && cpack -G "TGZ;ZIP" -C Debug) || echo "CPack TGZ failed"
        shell: bash

      - name: Upload artifact - package
        uses: actions/upload-artifact@v4
        with:
          name: caudio-package-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/${{ matrix.preset }}/*.tar.gz
          if-no-files-found: warn

      - name: Upload artifact - docs
        uses: actions/upload-artifact@v4
        with:
          name: caudio-docs-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/${{ matrix.preset }}/docs/html
          if-no-files-found: warn

  ffmpeg-trimmed:
    name: ffmpeg-trimmed (windows-latest / MinGW, decode-only whitelist)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CAUDIO_TEST_NOAUDIO: 1
      CAUDIO_TRIMMED_ROOT: ${{ github.workspace }}/ffmpeg-trimmed
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2 (UCRT64 + trim build tools)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-zlib
            make
            pkgconf
            nasm

      - name: Restore trimmed FFmpeg prefix
        id: trimcache
        uses: actions/cache@v4
        with:
          # Key tracks the whitelist: any flag/version change rebuilds.
          path: ffmpeg-trimmed
          key: ffmpeg-trimmed-windows-${{ hashFiles('cmake/FFmpegTrimmed.cmake') }}

      - name: Configure (trimmed, fallback to default provider)
        id: pick
        run: |
          if cmake --preset ci-trimmed; then
            echo "preset=ci-trimmed" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::trimmed FFmpeg unavailable -- falling back to default provider"
            cmake --preset ci-gcc
            echo "preset=ci-gcc" >> "$GITHUB_OUTPUT"
          fi
        shell: msys2 {0}

      - name: Expose DLLs
        run: |
          # Trimmed DLLs live in the cached prefix; default-provider DLLs
          # follow the existing lookup (FetchContent _deps or system ffmpeg).
          # Absolute Windows-style dirs only (loader-readable).
          preset="${{ steps.pick.outputs.preset }}"
          dll=""
          if [ "$preset" = "ci-trimmed" ]; then
            dll=$(find "$CAUDIO_TRIMMED_ROOT/bin" -maxdepth 1 -name 'avcodec-*.dll' | head -n 1)
          fi
          if [ -z "$dll" ]; then
            dll=$(find "build/$preset/_deps" -name 'avcodec-*.dll' | head -n 1)
          fi
          if [ -z "$dll" ]; then
            fdir="$(dirname "$(command -v ffmpeg)")"
            dll=$(find "$fdir" -maxdepth 1 -name 'avcodec-*.dll' | head -n 1)
          fi
          test -n "$dll" || (echo "FFmpeg DLLs not found" && exit 1)
          cygpath -w "$(cd "$(dirname "$dll")" && pwd)" >> $GITHUB_PATH
          cygpath -w "$(dirname "$(command -v g++)")" >> $GITHUB_PATH
          echo "PATH additions:"; tail -n 2 "$GITHUB_PATH"
        shell: msys2 {0}

      - name: Build
        run: cmake --build --preset ${{ steps.pick.outputs.preset }}
        shell: msys2 {0}

      - name: Test
        env:
          CAUDIO_TEST_NOAUDIO: 1
        run: ctest --preset ${{ steps.pick.outputs.preset }}
        shell: msys2 {0}

  sanitizers:
    name: sanitizers (ubuntu-24.04 / gcc-16)
    runs-on: ubuntu-latest
    env:
      CAUDIO_TEST_NOAUDIO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version; g++-16 --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev
          ffmpeg -version || true
          cmake --version
          ninja --version

      - name: Configure (ASan+UBSan)
        env:
          CC: gcc-16
          CXX: g++-16
        run: cmake --preset ci-sanitizers

      - name: Build
        run: cmake --build --preset ci-sanitizers

      - name: Test
        env:
          CAUDIO_TEST_NOAUDIO: 1
          # Known FFmpeg probe-buffer drip suppressed (see file); all other
          # leaks, UBSan and ASan reports stay fatal. NOTE: env blocks need
          # ${{ }} context syntax -- $VAR is NOT expanded here.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizers/lsan.supp:report_objects=1
        run: ctest --preset ci-sanitizers

  install-smoke:
    name: install-smoke (ubuntu-24.04 / gcc-16)
    runs-on: ubuntu-latest
    env:
      CAUDIO_TEST_NOAUDIO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version; g++-16 --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev graphviz
          cmake --version
          ninja --version

      - name: Configure
        env:
          CC: gcc-16
          CXX: g++-16
        run: cmake --preset ci-gcc

      - name: Build
        run: cmake --build --preset ci-gcc

      - name: Test
        env:
          CAUDIO_TEST_NOAUDIO: 1
        run: ctest --preset ci-gcc

      - name: Install to /tmp/caudio-install
        run: cmake --install build/ci-gcc --prefix /tmp/caudio-install

      - name: Verify install layout
        run: |
          echo "=== install tree ==="
          find /tmp/caudio-install -type f | head -n 100
          echo "=== caudio --version ==="
          /tmp/caudio-install/bin/caudio --version || build/ci-gcc/caudio --version || echo "caudio --version check failed"
          echo "=== version.hpp ==="
          test -f /tmp/caudio-install/include/caudio/version.hpp && echo "version.hpp found" || (echo "version.hpp missing" && exit 1)
          echo "=== no module sources in header-mode install ==="
          test ! -d /tmp/caudio-install/include/caudio/src && echo "no src/*.cppm (expected, modules OFF)" || (echo "unexpected src/*.cppm shipped" && exit 1)
          echo "=== module sources shipped (dev component, build stays opt-in) ==="
          test -f /tmp/caudio-install/modules/caudio.cppm && echo "modules/caudio.cppm found" || (echo "modules/caudio.cppm missing" && exit 1)
          test -f /tmp/caudio-install/lib/cmake/caudio/caudioConfig.cmake && echo "caudioConfig.cmake found" || echo "caudioConfig.cmake missing"
          test -f /tmp/caudio-install/lib/cmake/caudio/FindFFmpeg.cmake && echo "FindFFmpeg.cmake found" || (echo "FindFFmpeg.cmake missing" && exit 1)
          test -f /tmp/caudio-install/include/caudio/version_config.hpp && echo "version_config.hpp found" || (echo "version_config.hpp missing" && exit 1)

      - name: Smoke compile (find_package + headers)
        run: |
          mkdir -p /tmp/caudio-smoke
          cat > /tmp/caudio-smoke/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(caudio_smoke CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          list(APPEND CMAKE_PREFIX_PATH "/tmp/caudio-install")
          find_package(caudio CONFIG REQUIRED)
          add_executable(smoke main.cpp)
          target_link_libraries(smoke PRIVATE caudio::utils)
          EOF
          cat > /tmp/caudio-smoke/main.cpp << 'EOF'
          #include <caudio/utils.hpp>
          #include <caudio/version.hpp>
          #include <print>
          int main() {
            std::println("caudio smoke ok: {}", caudio::version::shortVersion());
            return 0;
          }
          EOF
          cmake -B /tmp/caudio-smoke/build -G Ninja -DCMAKE_PREFIX_PATH=/tmp/caudio-install -DCMAKE_CXX_STANDARD=23 /tmp/caudio-smoke
          cmake --build /tmp/caudio-smoke/build -v
          /tmp/caudio-smoke/build/smoke || ./tmp/caudio-smoke/build/smoke

  modules-smoke:
    name: modules-smoke (ubuntu-24.04 / gcc-16)
    runs-on: ubuntu-latest
    env:
      CAUDIO_TEST_NOAUDIO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version; g++-16 --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev
          cmake --version
          ninja --version

      - name: Configure (modules ON)
        env:
          CC: gcc-16
          CXX: g++-16
        run: cmake --preset modules-gcc

      - name: Build
        run: cmake --build --preset modules-gcc

      - name: Install to /tmp/caudio-install-mod
        run: cmake --install build/modules-gcc --prefix /tmp/caudio-install-mod

      - name: Verify module sources shipped
        run: |
          test -f /tmp/caudio-install-mod/modules/caudio.cppm && echo "caudio.cppm found" || (echo "caudio.cppm missing" && exit 1)
          ls /tmp/caudio-install-mod/modules/*/*.cppm /tmp/caudio-install-mod/modules/*/*/*.cppm | head -n 20

      - name: Smoke compile (find_package + import caudio.utils)
        run: |
          mkdir -p /tmp/caudio-mod-smoke
          # Correct consumption: link caudio::utils (which carries its own
          # installed CXX_MODULES file set) and import the module. Do NOT list
          # the installed .cppm files in our own FILE_SET -- that compiles the
          # same module names twice and CMake aborts with "Disagreement of the
          # location of the 'caudio.utils' module".
          cat > /tmp/caudio-mod-smoke/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(caudio_mod_smoke CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_SCAN_FOR_MODULES ON)
          list(APPEND CMAKE_PREFIX_PATH "/tmp/caudio-install-mod")
          find_package(caudio CONFIG REQUIRED)
          add_executable(smoke main.cpp)
          target_compile_features(smoke PRIVATE cxx_std_23)
          target_link_libraries(smoke PRIVATE caudio::utils)
          EOF
          cat > /tmp/caudio-mod-smoke/main.cpp << 'EOF'
          #include <print>
          import caudio.version;
          int main() {
            std::println("caudio module smoke ok: {}", caudio::version::shortVersion());
            return 0;
          }
          EOF
          cmake -B /tmp/caudio-mod-smoke/build -G Ninja -DCMAKE_PREFIX_PATH=/tmp/caudio-install-mod -DCMAKE_CXX_STANDARD=23 /tmp/caudio-mod-smoke
          cmake --build /tmp/caudio-mod-smoke/build -v
          /tmp/caudio-mod-smoke/build/smoke
