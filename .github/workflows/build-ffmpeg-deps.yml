name: Build & Upload Trimmed FFmpeg (deps-private)

# One matrix job drives scripts/build-trimmed.py on every OS/arch. Stable
# legs gate the release; experimental legs run too but never block it
# (continue-on-error). Asset names encode OS+arch.

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: "FFmpeg version to trim (e.g., 8.1.2)"
        required: true
        default: "8.1.2"
      rebuild_counter:
        description: "Rebuild counter for same version (e.g., 1, 2)"
        required: true
        default: "1"
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}${{ matrix.experimental && ' (experimental)' || '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, runner: windows-latest, asset: windows-x86_64, file_tag: x86-64, experimental: false, cc: "clang" }
          - { os: windows, runner: windows-11-arm, asset: windows-arm64, file_tag: ARM64, experimental: true, cc: "clang" }
          - { os: linux, runner: ubuntu-24.04, asset: linux-x86_64, file_tag: x86-64, experimental: false }
          - { os: linux, runner: ubuntu-24.04-arm, asset: linux-arm64, file_tag: aarch64, experimental: false }
          - { os: macos, runner: macos-latest, asset: macos-arm64, file_tag: arm64, experimental: false }
          - { os: macos, runner: macos-latest, asset: macos-x86_64, file_tag: x86_64, experimental: true, cc: "clang --target=x86_64-apple-macosx", extra_args: "--arch=x86_64" }
    env:
      DEPS_REPO: "AhmedowM/deps-private"
      FFMPEG_VERSION: ${{ inputs.ffmpeg_version || '8.1.2' }}
      REBUILD: ${{ inputs.rebuild_counter || '1' }}
      RELEASE_TAG: "ffmpeg-trimmed-${{ inputs.ffmpeg_version || '8.1.2' }}-${{ inputs.rebuild_counter || '1' }}"
      ARTIFACT_NAME: "ffmpeg-trimmed-${{ inputs.ffmpeg_version || '8.1.2' }}-${{ matrix.asset }}.tar.gz"
    steps:
      - name: Checkout (for the script + flags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2 (Windows shell + toolchain)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.asset == 'windows-arm64' && 'CLANGARM64' || 'UCRT64' }}
          update: true
          install: ${{ matrix.asset == 'windows-arm64' && 'mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-zlib mingw-w64-clang-aarch64-python make pkgconf git file' || 'mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-lld mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-python make pkgconf nasm git file' }}

      - name: Install build deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config zlib1g-dev
          if [ "${{ matrix.asset }}" = "linux-x86_64" ]; then sudo apt-get install -y nasm; fi

      - name: Install build deps (macOS)
        if: matrix.os == 'macos'
        run: |
          brew update || echo "brew update failed, continuing with snapshot"
          brew install nasm pkg-config zlib || brew upgrade nasm pkg-config zlib

      - name: Validate flags parse
        if: matrix.os != 'windows'
        run: python3 scripts/build-trimmed.py --print-flags > /dev/null

      - name: Validate flags parse (Windows)
        if: matrix.os == 'windows'
        run: python3 scripts/build-trimmed.py --print-flags > /dev/null
        shell: msys2 {0}

      - name: Build trimmed FFmpeg
        if: matrix.os != 'windows'
        env:
          CC: ${{ matrix.cc }}
        run: |
          python3 scripts/build-trimmed.py --extra-configure-args="${{ matrix.extra_args }}" --prefix "$PWD/ffmpeg-trimmed" --ffmpeg-version "${{ env.FFMPEG_VERSION }}" --pack "$PWD/${{ env.ARTIFACT_NAME }}"

      - name: Build trimmed FFmpeg (Windows)
        if: matrix.os == 'windows'
        env:
          CC: ${{ matrix.cc }}
        run: |
          python3 scripts/build-trimmed.py --bash "$(cygpath -w "$(command -v bash)")" --prefix "$PWD/ffmpeg-trimmed" --ffmpeg-version "${{ env.FFMPEG_VERSION }}" --pack "$PWD/${{ env.ARTIFACT_NAME }}"
        shell: msys2 {0}

      - name: Assert output arch
        if: matrix.os != 'windows'
        run: |
          ls ffmpeg-trimmed/lib/
          file ffmpeg-trimmed/lib/* | tee arch.txt
          grep -q "${{ matrix.file_tag }}" arch.txt

      - name: Assert output arch (Windows)
        if: matrix.os == 'windows'
        run: |
          ls ffmpeg-trimmed/bin/
          file ffmpeg-trimmed/bin/*.dll | tee arch.txt
          grep -q "${{ matrix.file_tag }}" arch.txt
        shell: msys2 {0}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.asset }}
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error

  release:
    name: Create Release & Upload Assets
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPS_REPO: "AhmedowM/deps-private"
      FFMPEG_VERSION: ${{ inputs.ffmpeg_version || '8.1.2' }}
      REBUILD: ${{ inputs.rebuild_counter || '1' }}
      RELEASE_TAG: "ffmpeg-trimmed-${{ inputs.ffmpeg_version || '8.1.2' }}-${{ inputs.rebuild_counter || '1' }}"
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la ./artifacts/

      - name: Create/Update Release
        env:
          GH_TOKEN: ${{ secrets.DEPS_PAT }}
        run: |
          if gh release view "${{ env.RELEASE_TAG }}" --repo "${{ env.DEPS_REPO }}" >/dev/null 2>&1; then
            echo "Release exists, uploading assets..."
          else
            echo "Creating new release..."
            gh release create "${{ env.RELEASE_TAG }}" \
              --repo "${{ env.DEPS_REPO }}" \
              --title "Trimmed FFmpeg ${{ env.FFMPEG_VERSION }} (rebuild ${{ github.event.inputs.rebuild_counter || '1' }})" \
              --notes "Decode-only whitelist, built from cmake/FFmpegTrimmed.cmake flags."
          fi

      - name: Upload Windows assets
        if: always() && hashFiles('artifacts/ffmpeg-trimmed-*-windows-*.tar.gz') != ''
        env:
          GH_TOKEN: ${{ secrets.DEPS_PAT }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" \
            --repo "${{ env.DEPS_REPO }}" \
            --clobber \
            artifacts/ffmpeg-trimmed-*-windows-*.tar.gz

      - name: Upload Linux assets
        if: always() && hashFiles('artifacts/ffmpeg-trimmed-*-linux-*.tar.gz') != ''
        env:
          GH_TOKEN: ${{ secrets.DEPS_PAT }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" \
            --repo "${{ env.DEPS_REPO }}" \
            --clobber \
            artifacts/ffmpeg-trimmed-*-linux-*.tar.gz

      - name: Upload macOS assets
        if: always() && hashFiles('artifacts/ffmpeg-trimmed-*-macos-*.tar.gz') != ''
        env:
          GH_TOKEN: ${{ secrets.DEPS_PAT }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" \
            --repo "${{ env.DEPS_REPO }}" \
            --clobber \
            artifacts/ffmpeg-trimmed-*-macos-*.tar.gz
