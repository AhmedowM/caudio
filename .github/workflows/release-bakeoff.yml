# Release bake-off (MANUAL observatory, not a gate).
#
# Compares compiler x preset-family combinations on size and shippability.
# Legs are build + install + smoke + measure (no tests; correctness is
# gated by ci.yml, not here).
#
# - FFmpeg: deps-private trimmed asset (DEPS_PAT) via CAUDIO_TRIMMED_ROOT,
#   else system provider. The winning provider is recorded per leg.
# - Apple legs do NOT install brew llvm; they use the *-apple presets
#   (xcrun + CAUDIO_ALLOW_UNSUPPORTED_COMPILER + CAUDIO_APPLE_CLANG).
# - Checkout uses fetch-depth: 0 (release presets require a git tag).
# - Legs are informational (continue-on-error) with a summary in `report`.

name: Release bake-off (manual)

"on":
  workflow_dispatch:
    inputs:
      run_macos:
        required: false
        description: 'Run macOS legs (brew-LLVM vs AppleClang)'
        type: boolean
        default: true
      run_linux:
        required: false
        description: 'Run Linux legs (gcc-16 vs llvm-21)'
        type: boolean
        default: true
      run_windows:
        required: false
        description: 'Run Windows legs (LLVM vs MSVC)'
        type: boolean
        default: true
      strict:
        required: false
        description: 'Fail the run on any finding (shipping-candidate mode)'
        type: boolean
        default: false
      deps_tag:
        required: false
        description: 'deps-private trimmed FFmpeg release tag'
        default: 'ffmpeg-trimmed-8.1.2-2'
      force_system:
        required: false
        description: 'Skip trimmed download; exercise the system-provider path'
        type: boolean
        default: false
      run_linux_arm:
        required: false
        description: 'Also run linux arm64 legs (ubuntu-24.04-arm)'
        type: boolean
        default: false
      smoke_debug:
        required: false
        description: 'On smoke failure, dump readelf/ldd/LD_DEBUG diagnostics (linux legs)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bake-macos:
    name: mac ${{ matrix.compiler }} / ${{ matrix.family }} / ${{ matrix.arch }}
    if: inputs.run_macos
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    continue-on-error: ${{ inputs.strict == false }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [brew, apple]
        family: [release, release-lto, minsize, minsize-lto]
        arch: [arm64, x86_64]
    env:
      CAUDIO_TEST_NOAUDIO: 1
      DEPS_REPO: "AhmedowM/deps-private"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup brew LLVM (brew legs only)
        if: matrix.compiler == 'brew'
        run: |
          brew update || echo "brew update failed, continuing with snapshot"
          brew install llvm || brew upgrade llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH
          "$LLVM_PREFIX/bin/clang" --version
          LLVM_MAJOR="$("$LLVM_PREFIX/bin/clang" -dumpversion | cut -d. -f1)"
          test "$LLVM_MAJOR" -ge 20 || (echo "brew LLVM too old: $LLVM_MAJOR" && exit 1)

      - name: Select Xcode 26 (apple legs only)
        if: matrix.compiler == 'apple'
        run: |
          # Pin Xcode 26 (AppleClang) when the image ships it; no brew LLVM.
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcode-select -p
          xcodebuild -version || true
          xcrun clang --version

      - name: Install dependencies
        run: |
          brew install ninja || brew upgrade ninja || true
          cmake --version
          ninja --version

      - name: "Download trimmed FFmpeg (fallback: system)"
        id: trimdl
        if: ${{ !inputs.force_system }}
        env:
          GH_TOKEN: ${{ secrets.DEPS_PAT }}
          CAUDIO_TRIMMED_ROOT: ${{ github.workspace }}/ffmpeg-trimmed
        run: |
          if gh release download "${{ inputs.deps_tag }}" \
            --repo "${{ env.DEPS_REPO }}" \
            --pattern "ffmpeg-trimmed-8.1.2-macos-${{ matrix.arch }}.tar.gz" \
            --dir . \
            --clobber; then
            mkdir -p "$CAUDIO_TRIMMED_ROOT"
            tar -xzf ffmpeg-trimmed-8.1.2-macos-${{ matrix.arch }}.tar.gz -C "$CAUDIO_TRIMMED_ROOT"
            echo "CAUDIO_TRIMMED_ROOT=$CAUDIO_TRIMMED_ROOT" >> "$GITHUB_ENV"
            echo "trim_root=$CAUDIO_TRIMMED_ROOT" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::trimmed FFmpeg unavailable -- leg uses system provider"
            echo "trim_root=" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Configure
        id: cfg
        run: |
          # AppleClang legs use dedicated *-apple presets (xcrun toolchain);
          # brew legs use plain *-clang.
          if [ "${{ matrix.compiler }}" = "apple" ]; then SUFFIX=apple; else SUFFIX=clang; fi
          PRESET="${{ matrix.family }}-$SUFFIX"
          set -o pipefail
          EXTRA="-DCAUDIO_BUNDLE_FFMPEG_MACOS=ON"
          if [ -n "${{ steps.trimdl.outputs.trim_root }}" ]; then
            echo "provider=trimmed (CAUDIO_TRIMMED_ROOT cascade)" >> "$GITHUB_OUTPUT"
          else
            echo "provider=system" >> "$GITHUB_OUTPUT"
          fi
          cmake --preset "$PRESET" $EXTRA 2>&1 | tee configure.log
          echo "preset=$PRESET" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          START=$SECONDS
          cmake --build --preset ${{ steps.cfg.outputs.preset }} 2>&1 | tee build.log
          echo "build_seconds=$((SECONDS - START))" | tee -a build.log

      - name: Install + smoke + measure
        id: measure
        run: |
          set -o pipefail
          PRESET="${{ steps.cfg.outputs.preset }}"
          cmake --install "build/$PRESET" --prefix "$RUNNER_TEMP/stage" 2>&1 | tee install.log
          echo "provider=${{ steps.cfg.outputs.provider }} preset=${{ steps.cfg.outputs.preset }}"
          echo "=== staged tree (proves what ships) ==="
          find "$RUNNER_TEMP/stage" -type f | sort
          BIN="$RUNNER_TEMP/stage/bin/caudio"
          test -x "$BIN" || (echo "staged binary missing" && exit 1)
          "$BIN" --version
          otool -L "$BIN" | head -n 12 || true
          # brew-LLVM legs are build-only: the toolchain emits an absolute
          # libc++ install-name by design (issue #2), so the shippability
          # ref check does not apply to them.
          if [ "${{ matrix.compiler }}" != "brew" ]; then
            echo "=== portability: no absolute brew/local/build-tree refs allowed ==="
            otool -L "$BIN"
            if otool -L "$BIN" | grep -E "/opt/homebrew/|/usr/local/|ffmpeg-trimmed/"; then
              echo "portability check failed: absolute third-party refs above"
              exit 1
            fi
          else
            echo "=== portability check skipped (brew-LLVM leg is build-only) ==="
          fi
          echo "bin_bytes=$(stat -f%z "$BIN")"
          (cd "build/$PRESET" && cpack -G TGZ) 2>&1 | tail -n 3 || echo "cpack failed"
          RT=$(ls build/$PRESET/*-runtime.tar.gz 2>/dev/null | head -n 1 || true)
          DEV=$(ls build/$PRESET/*-dev.tar.gz 2>/dev/null | head -n 1 || true)
          if [ -n "$RT" ]; then echo "pkg_bytes=$(stat -f%z "$RT")"; else echo "pkg_bytes=0"; fi
          if [ -n "$DEV" ]; then echo "dev_bytes=$(stat -f%z "$DEV")"; else echo "dev_bytes=0"; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bakeoff-macos-${{ matrix.compiler }}-${{ matrix.family }}-${{ matrix.arch }}
          path: |
            configure.log
            build.log
            install.log
          if-no-files-found: warn

  bake-linux:
    name: linux ${{ matrix.compiler }} / ${{ matrix.family }} / ${{ matrix.arch }}
    if: inputs.run_linux
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    continue-on-error: ${{ inputs.strict == false }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, llvm]
        family: [release, release-lto, minsize, minsize-lto]
        arch: ${{ fromJSON(inputs.run_linux_arm && '["x86_64", "arm64"]' || '["x86_64"]') }}
    env:
      CAUDIO_TEST_NOAUDIO: 1
      DEPS_REPO: "AhmedowM/deps-private"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC 16
        if: matrix.compiler == 'gcc'
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          sudo update-alternatives --set gcc /usr/bin/gcc-16 || true
          gcc --version; g++ --version

      - name: Setup LLVM 21
        if: matrix.compiler == 'llvm'
        run: |
          # Same hardened installer as compilers.yml / release.yml.
          sudo apt-get update
          sudo apt-get install -y lsb-release wget gnupg
          CODENAME="$(lsb_release -cs)"
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt-llvm-org.asc > /dev/null
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          for i in 1 2 3; do sudo apt-get update && break || sleep 10; done
          sudo apt-get install -y clang-21 lld-21
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/local/bin/clang++
          hash -r; clang --version; clang++ --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev
          cmake --version
          ninja --version

      - name: "Download trimmed FFmpeg (fallback: system)"
        id: trimdl
        if: ${{ !inputs.force_system }}
        env:
          GH_TOKEN: ${{ secrets.DEPS_PAT }}
          CAUDIO_TRIMMED_ROOT: ${{ github.workspace }}/ffmpeg-trimmed
        run: |
          if gh release download "${{ inputs.deps_tag }}" \
            --repo "${{ env.DEPS_REPO }}" \
            --pattern "ffmpeg-trimmed-8.1.2-linux-${{ matrix.arch }}.tar.gz" \
            --dir . \
            --clobber; then
            mkdir -p "$CAUDIO_TRIMMED_ROOT"
            tar -xzf ffmpeg-trimmed-8.1.2-linux-${{ matrix.arch }}.tar.gz -C "$CAUDIO_TRIMMED_ROOT"
            echo "CAUDIO_TRIMMED_ROOT=$CAUDIO_TRIMMED_ROOT" >> "$GITHUB_ENV"
            echo "trim_root=$CAUDIO_TRIMMED_ROOT" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::trimmed FFmpeg unavailable -- leg uses system provider"
            echo "trim_root=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        id: cfg
        run: |
          # Preset name is uniform: <family>-<gcc|clang> (toolchain resolves
          # bare names from PATH, same as compilers.yml).
          if [ "${{ matrix.compiler }}" = "gcc" ]; then SUFFIX=gcc; else SUFFIX=clang; fi
          PRESET="${{ matrix.family }}-$SUFFIX"
          set -o pipefail
          EXTRA="-DCAUDIO_BUNDLE_FFMPEG_MACOS=ON"
          if [ -n "${{ steps.trimdl.outputs.trim_root }}" ]; then
            echo "provider=trimmed (CAUDIO_TRIMMED_ROOT cascade)" >> "$GITHUB_OUTPUT"
          else
            echo "provider=system" >> "$GITHUB_OUTPUT"
          fi
          cmake --preset "$PRESET" $EXTRA 2>&1 | tee configure.log
          echo "preset=$PRESET" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          START=$SECONDS
          cmake --build --preset ${{ steps.cfg.outputs.preset }} 2>&1 | tee build.log
          echo "build_seconds=$((SECONDS - START))" | tee -a build.log

      - name: Install + smoke + measure
        run: |
          set -o pipefail
          PRESET="${{ steps.cfg.outputs.preset }}"
          cmake --install "build/$PRESET" --prefix "$RUNNER_TEMP/stage" 2>&1 | tee install.log
          echo "provider=${{ steps.cfg.outputs.provider }} preset=${{ steps.cfg.outputs.preset }}"
          echo "=== staged tree (proves what ships) ==="
          find "$RUNNER_TEMP/stage" -type f | sort
          BIN="$RUNNER_TEMP/stage/bin/caudio"
          test -x "$BIN" || (echo "staged binary missing" && exit 1)
          SMOKE_RC=0
          PORT_RC=0
          "$BIN" --version || SMOKE_RC=$?
          if [ "$SMOKE_RC" -ne 0 ] && [ "${{ inputs.smoke_debug }}" = "true" ]; then
            echo "=== smoke failed ($SMOKE_RC): loader + init diagnostics ==="
            readelf -d "$BIN" | grep -E "NEEDED|RUNPATH|RPATH" || true
            ldd "$BIN" || true
            LD_DEBUG=libs "$BIN" --version 2>&1 | tail -n 25 || true
            echo "=== arg-independence: --help and bogus subcommand ==="
            "$BIN" --help > /tmp/help.txt 2>&1 || HELP_RC=$?; echo "help_rc=${HELP_RC:-0}"
            head -n 3 /tmp/help.txt || true
            "$BIN" __no_such_cmd__ > /tmp/bogus.txt 2>&1 || BOGUS_RC=$?; echo "bogus_rc=${BOGUS_RC:-0}"
            head -n 3 /tmp/bogus.txt || true
            echo "=== strace tail (last syscalls before death) ==="
            strace -f -e trace=%process,%network,file,signal -o /tmp/strace.log "$BIN" --version > /dev/null 2>&1 || true
            tail -n 30 /tmp/strace.log || echo "strace unavailable or empty"
          fi
          ldd "$BIN" | head -n 15 || true
          echo "=== portability: FFmpeg must resolve under stage/ ==="
          if ldd "$BIN" | grep -E "libav|swresample|swscale" | grep -vF "$RUNNER_TEMP/stage"; then
            echo "portability check failed: FFmpeg resolves outside the stage tree"
            PORT_RC=1
          fi
          echo "bin_bytes=$(stat -c%s "$BIN")"
          size -A "$BIN" 2>/dev/null | sort -k2 -n -r | head -n 8 || true
          (cd "build/$PRESET" && cpack -G TGZ) 2>&1 | tail -n 3 || echo "cpack failed"
          RT=$(ls build/$PRESET/*-runtime.tar.gz 2>/dev/null | head -n 1 || true)
          DEV=$(ls build/$PRESET/*-dev.tar.gz 2>/dev/null | head -n 1 || true)
          if [ -n "$RT" ]; then echo "pkg_bytes=$(stat -c%s "$RT")"; else echo "pkg_bytes=0"; fi
          if [ -n "$DEV" ]; then echo "dev_bytes=$(stat -c%s "$DEV")"; else echo "dev_bytes=0"; fi
          if [ "$SMOKE_RC" -ne 0 ]; then exit "$SMOKE_RC"; fi
          exit "$PORT_RC"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bakeoff-linux-${{ matrix.compiler }}-${{ matrix.family }}-${{ matrix.arch }}
          path: |
            configure.log
            build.log
            install.log
          if-no-files-found: warn

  bake-windows:
    name: win ${{ matrix.compiler }} / ${{ matrix.family }} / ${{ matrix.arch }}
    if: inputs.run_windows
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    continue-on-error: ${{ inputs.strict == false }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        compiler: [llvm, msvc]
        family: [release, release-lto, minsize, minsize-lto]
        # MSVC presets pin the VS 2026 x64 generator, so MSVC stays x86_64.
        exclude:
          - { compiler: msvc, arch: arm64 }
    env:
      CAUDIO_TEST_NOAUDIO: 1
      DEPS_REPO: "AhmedowM/deps-private"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup LLVM 21
        if: matrix.compiler == 'llvm'
        run: |
          # Pinned LLVM 21, arch-matched official archive (MSVC ABI target).
          LLVM_VER=21.1.0
          if [ "${{ matrix.arch }}" = "arm64" ]; then TRIPLE=aarch64-pc-windows-msvc; else TRIPLE=x86_64-pc-windows-msvc; fi
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VER}/clang+llvm-${LLVM_VER}-${TRIPLE}.tar.xz"
          # RUNNER_TEMP is a native path (D:\a\_temp); normalize for bash
          # tools, then hand GITHUB_PATH the native form back via cygpath.
          LLVM_ROOT="$(cygpath -u "$RUNNER_TEMP")/llvm"
          mkdir -p "$LLVM_ROOT"
          tar -xJf llvm.tar.xz -C "$LLVM_ROOT" --strip-components=1
          echo "$(cygpath -w "$LLVM_ROOT/bin")" >> "$GITHUB_PATH"
          "$LLVM_ROOT/bin/clang++.exe" --version
        shell: bash

      - name: Install dependencies
        run: |
          choco install ninja -y --no-progress || echo "ninja choco install failed"
          cmake --version
          ninja --version
        shell: bash

      - name: "Download trimmed FFmpeg (fallback: system)"
        id: trimdl
        if: ${{ !inputs.force_system }}
        env:
          GH_TOKEN: ${{ secrets.DEPS_PAT }}
        run: |
          if gh release download "${{ inputs.deps_tag }}" \
            --repo "${{ env.DEPS_REPO }}" \
            --pattern "ffmpeg-trimmed-8.1.2-windows-${{ matrix.arch }}.tar.gz" \
            --dir . \
            --clobber; then
            # Git-Bash (not MSYS2): no automatic path conversion, so
            # normalize with cygpath like release.yml/ci.yml do -- a raw
            # "D:\..." path silently mkdirs/tars the wrong place.
            if command -v cygpath >/dev/null 2>&1; then
              TROOT="$(cygpath "${{ github.workspace }}/ffmpeg-trimmed")"
            else
              TROOT="${{ github.workspace }}/ffmpeg-trimmed"
            fi
            mkdir -p "$TROOT"
            tar -xzf ffmpeg-trimmed-8.1.2-windows-${{ matrix.arch }}.tar.gz -C "$TROOT"
            echo "CAUDIO_TRIMMED_ROOT=$TROOT" >> "$GITHUB_ENV"
            echo "trim_root=$TROOT" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::trimmed FFmpeg unavailable -- leg uses system provider"
            echo "trim_root=" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Configure
        id: cfg
        run: |
          # Uniform preset names: <family>-<clang|msvc>. MSVC presets pin the
          # VS 2026 x64 generator, so only the LLVM legs carry an arm64 runner.
          if [ "${{ matrix.compiler }}" = "msvc" ]; then SUFFIX=msvc; else SUFFIX=clang; fi
          PRESET="${{ matrix.family }}-$SUFFIX"
          set -o pipefail
          EXTRA="-DCAUDIO_BUNDLE_FFMPEG_MACOS=ON"
          if [ -n "${{ steps.trimdl.outputs.trim_root }}" ]; then
            echo "provider=trimmed (CAUDIO_TRIMMED_ROOT cascade)" >> "$GITHUB_OUTPUT"
          else
            echo "provider=system" >> "$GITHUB_OUTPUT"
          fi
          cmake --preset "$PRESET" $EXTRA 2>&1 | tee configure.log
          echo "preset=$PRESET" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build
        run: |
          set -o pipefail
          START=$SECONDS
          cmake --build --preset ${{ steps.cfg.outputs.preset }} 2>&1 | tee build.log
          echo "build_seconds=$((SECONDS - START))" | tee -a build.log
        shell: bash

      - name: Install + smoke + measure
        run: |
          set -o pipefail
          PRESET="${{ steps.cfg.outputs.preset }}"
          # VS generators are multi-config: install defaults to Release
          # while minsize presets build MinSizeRel (single-config Ninja
          # ignores --config, so this stays Windows-only).
          CFG="Release"
          case "${{ matrix.family }}" in minsize*) CFG="MinSizeRel";; esac
          cmake --install "build/$PRESET" --config "$CFG" --prefix "$RUNNER_TEMP/stage" 2>&1 | tee install.log
          echo "provider=${{ steps.cfg.outputs.provider }} preset=${{ steps.cfg.outputs.preset }}"
          echo "=== staged tree (proves what ships) ==="
          find "$RUNNER_TEMP/stage" -type f | sort
          BIN="$RUNNER_TEMP/stage/bin/caudio.exe"
          test -x "$BIN" || (echo "staged binary missing" && exit 1)
          "$BIN" --version
          echo "bin_bytes=$(stat -c%s "$BIN")"
          # Multi-config VS generator: package the built config (MinSizeRel),
          # not the Release default (same --config stratification as install).
          CFG="Release"
          case "${{ matrix.family }}" in minsize*) CFG="MinSizeRel";; esac
          (cd "build/$PRESET" && cpack -C "$CFG" -G ZIP) 2>&1 | tail -n 3 || echo "cpack failed"
          RT=$(ls build/$PRESET/*-runtime.zip 2>/dev/null | head -n 1 || true)
          DEV=$(ls build/$PRESET/*-dev.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$RT" ]; then echo "pkg_bytes=$(stat -c%s "$RT")"; else echo "pkg_bytes=0"; fi
          if [ -n "$DEV" ]; then echo "dev_bytes=$(stat -c%s "$DEV")"; else echo "dev_bytes=0"; fi
        shell: bash

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bakeoff-windows-${{ matrix.compiler }}-${{ matrix.family }}-${{ matrix.arch }}
          path: |
            configure.log
            build.log
            install.log
          if-no-files-found: warn

  report:
    name: bake-off report
    needs: [bake-macos, bake-linux, bake-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        run: |
          {
            echo "# Release bake-off (manual run)"
            echo ""
            echo "| Leg | Result |"
            echo "| --- | ------ |"
            echo "| macos | ${{ needs.bake-macos.result }} |"
            echo "| linux | ${{ needs.bake-linux.result }} |"
            echo "| windows | ${{ needs.bake-windows.result }} |"
            echo ""
            echo "Per-leg artifacts (bakeoff-<os>-<compiler>-<family>) hold"
            echo "configure/build/install logs. Numbers live in the job logs:"
            echo "search for bin_bytes= / pkg_bytes= / build_seconds= /"
            echo "provider=, plus the staged-tree listing (what ships) and"
            echo "otool/ldd output (what it links). Compare within an OS --"
            echo "cross-OS bytes are not comparable (formats/toolchains)."
          } >> "$GITHUB_STEP_SUMMARY"
