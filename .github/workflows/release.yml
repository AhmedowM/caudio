name: Release

"on":
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    name: package (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # NOTE: ubuntu-latest is 24.04 today but migrates to 26.04 in Nov 2026
        # (new kernel/CMake/FFmpeg, PPA gcc-16 support TBD) -- re-validate then.
        # Compiler lives in the preset (same scheme as ci.yml); `compiler`
        # below is display + artifact naming only. macOS is LLVM Clang --
        # GCC builds miniaudio with the dummy backend (no audio).
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            compiler: gcc-16
            preset: release-gcc
          - os: macos-latest
            compiler: clang
            preset: release-clang
          - os: windows-latest
            compiler: windows-gcc
            preset: release-gcc
          - os: windows-latest
            compiler: msvc
            preset: release-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version; g++-16 --version
          sudo update-alternatives --set gcc /usr/bin/gcc-16 || true

      - name: Setup LLVM Clang (macOS)
        if: runner.os == 'macOS'
        run: |
          # Policy: LLVM Clang only on Apple (brew `llvm` is keg-only, so it
          # never shadows system clang -- the toolchain resolves
          # "$(brew --prefix llvm)/bin/clang" explicitly).
          brew install llvm || brew upgrade llvm || true
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH
          "$LLVM_PREFIX/bin/clang" --version
          "$LLVM_PREFIX/bin/clang++" --version

      - name: Setup GCC (Windows)
        if: runner.os == 'Windows' && matrix.compiler == 'windows-gcc'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils

      - name: Add MinGW to PATH (Windows)
        if: runner.os == 'Windows' && matrix.compiler == 'windows-gcc'
        run: echo "${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin" >> $GITHUB_PATH
        shell: bash

      - name: Verify GCC 16 (Windows)
        if: runner.os == 'Windows' && matrix.compiler == 'windows-gcc'
        run: |
          command -v gcc || (echo "gcc not on PATH after msys2 setup" && exit 1)
          command -v g++ || (echo "g++ not on PATH after msys2 setup" && exit 1)
          gcc --version || exit 1
          g++ --version || exit 1
        shell: bash

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev rpm nsis || echo "Some packages unavailable, continuing"
          ffmpeg -version || true
          cmake --version
          ninja --version
          cpack --version || cmake --version

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja ffmpeg || brew upgrade ninja ffmpeg || true
          ffmpeg -version || true
          cmake --version
          ninja --version

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y --no-progress || echo "ninja choco install failed"
          choco install ffmpeg -y --no-progress || echo "ffmpeg choco install failed, will use SetupFFmpeg fallback"
          cmake --version
          ninja --version
          ffmpeg -version || echo "ffmpeg not on PATH, relying on SetupFFmpeg fallback"
          cpack --version || cmake --version

      # Release packaging only -- testing lives in ci.yml. The release preset
      # requires a git tag (tag-triggered workflow checks out fetch-depth 0).
      - name: Configure (release preset)
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Package
        if: matrix.compiler != 'msvc'
        run: |
          # `cmake --build --target package` FIRST: it runs cpack with CWD in
          # the build tree so packages land in the build dir. A bare
          # `cpack --config` from the repo root writes them to the root
          # (CPACK_OUTPUT_DIRECTORY is not honored there -- verified).
          cmake --build --preset ${{ matrix.preset }} --target package || (cd build/${{ matrix.preset }} && cpack -G TGZ) || echo "CPack failed"
        shell: bash

      - name: Package (MSVC config)
        if: matrix.compiler == 'msvc'
        run: |
          # Multi-config generator: -C selects which built config to package.
          (cd build/${{ matrix.preset }} && cpack -G TGZ -C Release) || echo "CPack failed"
        shell: bash

      - name: List packages
        run: |
          echo "=== packages in build/${{ matrix.preset }}/ ==="
          ls -lh build/${{ matrix.preset }}/*.tar.gz build/${{ matrix.preset }}/*.zip
        shell: bash

      - name: Upload artifact - packages
        uses: actions/upload-artifact@v4
        with:
          name: caudio-packages-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/${{ matrix.preset }}/*.tar.gz
            build/${{ matrix.preset }}/*.zip
          # Only TGZ/ZIP are produced (CPACK_GENERATOR); a missing package
          # must fail loudly -- never ship a raw .exe as a "release" again.
          if-no-files-found: error

  release:
    name: release
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: caudio-packages-*
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== artifacts/ ==="
          find artifacts -type f | head -n 100
          ls -lh artifacts/ || true
          echo "=== CHANGELOG check ==="
          ls -lh CHANGELOG.md || echo "CHANGELOG.md not found"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**
            CHANGELOG.md
            VERSION
          generate_release_notes: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
