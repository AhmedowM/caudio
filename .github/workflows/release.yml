name: Release

"on":
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    name: package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Shipping matrix (decided from the release bake-off): MinSizeRel for
        # both the runtime and the dev archive from one build; AppleClang on
        # macOS; LLVM Clang on Linux and Windows (Windows targets the MSVC
        # ABI). Every GitHub x64+arm64 runner is covered. Compiler and arch
        # live in the matrix; `label` is display + build dir + artifact name.
        include:
          - { os: ubuntu-24.04,     label: linux-x86_64,   toolchain: clang, arch: x86_64, trim_asset: ffmpeg-trimmed-8.1.2-linux-x86_64.tar.gz,    pkg_ext: tar.gz }
          - { os: ubuntu-24.04-arm, label: linux-arm64,    toolchain: clang, arch: arm64,  trim_asset: ffmpeg-trimmed-8.1.2-linux-arm64.tar.gz,     pkg_ext: tar.gz }
          - { os: macos-15,         label: macos-arm64,    toolchain: apple, arch: arm64,  trim_asset: ffmpeg-trimmed-8.1.2-macos-arm64.tar.gz,     pkg_ext: tar.gz }
          - { os: macos-15-intel,   label: macos-x86_64,   toolchain: apple, arch: x86_64, trim_asset: ffmpeg-trimmed-8.1.2-macos-x86_64.tar.gz,    pkg_ext: tar.gz }
          - { os: windows-latest,   label: windows-x86_64, toolchain: clang, arch: x86_64, trim_asset: ffmpeg-trimmed-8.1.2-windows-x86_64.tar.gz,  pkg_ext: zip }
          - { os: windows-11-arm,   label: windows-arm64,  toolchain: clang, arch: arm64,  trim_asset: ffmpeg-trimmed-8.1.2-windows-arm64.tar.gz,   pkg_ext: zip }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup LLVM Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          # Same installer as the bake-off / compilers.yml legs.
          sudo apt-get update
          sudo apt-get install -y lsb-release wget gnupg
          CODENAME="$(lsb_release -cs)"
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt-llvm-org.asc > /dev/null
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          for i in 1 2 3; do sudo apt-get update && break || sleep 10; done
          sudo apt-get install -y clang-21 lld-21
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/local/bin/clang++
          hash -r; clang --version; clang++ --version

      - name: Select Xcode 26 (macOS)
        if: runner.os == 'macOS'
        run: |
          # AppleClang only (toolchain: apple). Pin Xcode 26 when the image ships
          # it; brew LLVM is deliberately absent from release builds.
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcode-select -p
          xcodebuild -version || true
          xcrun clang --version
          xcrun clang++ --version

      - name: Setup LLVM Clang 21 (Windows)
        if: runner.os == 'Windows'
        run: |
          # Pinned LLVM 21; official arch-matched archive (MSVC ABI target).
          LLVM_VER=21.1.0
          if [ "${{ matrix.label }}" = "windows-arm64" ]; then TRIPLE=aarch64-pc-windows-msvc; else TRIPLE=x86_64-pc-windows-msvc; fi
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VER}/clang+llvm-${LLVM_VER}-${TRIPLE}.tar.xz"
          # RUNNER_TEMP is a native path (D:\a\_temp); normalize for bash
          # tools, then hand GITHUB_PATH the native form back via cygpath.
          LLVM_ROOT="$(cygpath -u "$RUNNER_TEMP")/llvm"
          mkdir -p "$LLVM_ROOT"
          tar -xJf llvm.tar.xz -C "$LLVM_ROOT" --strip-components=1
          echo "$(cygpath -w "$LLVM_ROOT/bin")" >> "$GITHUB_PATH"
          "$LLVM_ROOT/bin/clang++.exe" --version
          "$LLVM_ROOT/bin/clang.exe" --version
        shell: bash

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev rpm nsis || echo "Some packages unavailable, continuing"
          ffmpeg -version || true
          cmake --version
          ninja --version
          cpack --version || cmake --version

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja ffmpeg || brew upgrade ninja ffmpeg || true
          ffmpeg -version || true
          cmake --version
          ninja --version

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y --no-progress || echo "ninja choco install failed"
          choco install ffmpeg -y --no-progress || echo "ffmpeg choco install failed, will use SetupFFmpeg fallback"
          cmake --version
          ninja --version
          ffmpeg -version || echo "ffmpeg not on PATH, relying on SetupFFmpeg fallback"
          cpack --version || cmake --version

      # The per-OS trimmed FFmpeg asset comes from deps-private; a failed
      # download falls back to the system/SetupFFmpeg provider (a trim
      # outage must never block a release).
      - name: Download trimmed FFmpeg
        id: trimdl
        env:
          GH_TOKEN: ${{ secrets.DEPS_PAT }}
          CAUDIO_TRIMMED_ROOT: ${{ github.workspace }}/ffmpeg-trimmed
        run: |
          if gh release download "ffmpeg-trimmed-8.1.2-2" \
            --repo "AhmedowM/deps-private" \
            --pattern "${{ matrix.trim_asset }}" \
            --dir . \
            --clobber; then
            echo "trim_root=${{ github.workspace }}/ffmpeg-trimmed" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::trimmed FFmpeg unavailable -- release ships default provider"
            echo "trim_root=" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Extract trimmed FFmpeg
        if: steps.trimdl.outputs.trim_root != ''
        run: |
          # cygpath exists on Windows/Git-Bash only; elsewhere the workspace
          # path is already POSIX. Normalize only when available.
          if command -v cygpath >/dev/null 2>&1; then
            troot="$(cygpath "${{ steps.trimdl.outputs.trim_root }}")"
          else
            troot="${{ steps.trimdl.outputs.trim_root }}"
          fi
          mkdir -p "$troot"
          tar -xzf "${{ matrix.trim_asset }}" -C "$troot"
        shell: bash

      # Release packaging only -- testing lives in ci.yml. The trimmed-first
      # cascade in CMakeLists.txt picks the trimmed provider when
      # CAUDIO_TRIMMED_ROOT is set (and falls back to the system/SetupFFmpeg
      # provider otherwise), so one intent serves both paths. A trim outage
      # must never block a release. The minsize families are also used by
      # the bake-off, so the tag guard is injected here.
      - name: Configure
        id: cfg
        env:
          CAUDIO_TRIMMED_ROOT: ${{ steps.trimdl.outputs.trim_root }}
        run: |
          set -o pipefail
          TRIMMED=""
          if [ -n "${{ steps.trimdl.outputs.trim_root }}" ]; then
            echo "provider=trimmed (CAUDIO_TRIMMED_ROOT cascade)"
            TRIMMED="--trimmed-ffmpeg --ffmpeg-root ${{ steps.trimdl.outputs.trim_root }}"
          else
            echo "::warning::trimmed FFmpeg unavailable -- release uses the default provider"
          fi
          EXTRA=""
          if [ "${{ matrix.toolchain }}" = "apple" ]; then EXTRA="--allow-unsupported-compiler"; fi
          python scripts/configure.py minsize --toolchain ${{ matrix.toolchain }} --arch ${{ matrix.arch }} $TRIMMED --require-git-version --build-dir "build/${{ matrix.label }}" $EXTRA 2>&1 | tee configure.log
          echo "build_dir=build/${{ matrix.label }}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build
        run: |
          TRIMMED=""
          if [ -n "${{ steps.trimdl.outputs.trim_root }}" ]; then
            TRIMMED="--trimmed-ffmpeg --ffmpeg-root ${{ steps.trimdl.outputs.trim_root }}"
          fi
          EXTRA=""
          if [ "${{ matrix.toolchain }}" = "apple" ]; then EXTRA="--allow-unsupported-compiler"; fi
          python scripts/configure.py minsize --toolchain ${{ matrix.toolchain }} --arch ${{ matrix.arch }} $TRIMMED --require-git-version --build-dir "build/${{ matrix.label }}" $EXTRA --build
        shell: bash

      - name: Package
        run: |
          # The `package` target runs CPack with CWD in the build tree, so the
          # archives land there. A bare `cpack --config` from the repo root
          # stages them under the root instead.
          TRIMMED=""
          if [ -n "${{ steps.trimdl.outputs.trim_root }}" ]; then
            TRIMMED="--trimmed-ffmpeg --ffmpeg-root ${{ steps.trimdl.outputs.trim_root }}"
          fi
          EXTRA=""
          if [ "${{ matrix.toolchain }}" = "apple" ]; then EXTRA="--allow-unsupported-compiler"; fi
          python scripts/configure.py minsize --toolchain ${{ matrix.toolchain }} --arch ${{ matrix.arch }} $TRIMMED --require-git-version --build-dir "build/${{ matrix.label }}" $EXTRA --package
        shell: bash

      - name: List packages
        run: |
          echo "=== packages in build/${{ matrix.label }}/ ==="
          ls -lh build/${{ matrix.label }}/*.${{ matrix.pkg_ext }}
        shell: bash

      - name: Upload artifact - packages
        uses: actions/upload-artifact@v4
        with:
          name: caudio-packages-${{ matrix.label }}
          path: |
            build/${{ matrix.label }}/*.${{ matrix.pkg_ext }}
          # One format per OS (pkg_ext above). A missing package must fail
          # loudly -- never ship a raw .exe as a "release" again.
          if-no-files-found: error

  release:
    name: release
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: caudio-packages-*
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== artifacts/ ==="
          find artifacts -type f | head -n 100
          ls -lh artifacts/ || true
          echo "=== CHANGELOG check ==="
          ls -lh CHANGELOG.md || echo "CHANGELOG.md not found"

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
        shell: bash

      - name: Extract release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/extract-changelog.py
          test -s release-notes.md
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # No VERSION/CHANGELOG.md attachments: the version is in the tag
          # name, the binary (--version) and the release title; the notes
          # body is the changelog section. Archives + SHA256SUMS only.
          files: |
            artifacts/**
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
