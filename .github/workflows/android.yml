# Android NDK compatibility matrix (manual observatory).
#
# Each leg builds the trimmed FFmpeg dependency for one NDK/ABI pair and then
# builds caudio through scripts/configure.py. Keep the default matrix small
# enough for routine checks; expand ndk_versions when qualifying a new NDK.

name: Android (manual)

"on":
  workflow_dispatch:
    inputs:
      ndk_versions:
        description: 'Exact NDK revisions accepted by setup-ndk (JSON array)'
        required: false
        default: '["r29", "r30"]'
      abis:
        description: 'Android ABIs to build (JSON array)'
        required: false
        default: '["arm64-v8a", "armeabi-v7a", "x86_64", "x86"]'
      android_api:
        description: "Minimum Android API level"
        required: false
        default: "24"
      ffmpeg_version:
        description: "FFmpeg version to build"
        required: false
        default: "8.1.2"
      strict:
        description: "Fail the workflow if any matrix leg fails"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: NDK ${{ matrix.ndk }} / ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: ${{ inputs.strict == false }}
    strategy:
      fail-fast: false
      matrix:
        ndk: ${{ fromJSON(inputs.ndk_versions) }}
        abi: ${{ fromJSON(inputs.abis) }}
    env:
      BUILD_DIR: build/android-${{ matrix.ndk }}-${{ matrix.abi }}
      FFMPEG_ROOT: ${{ github.workspace }}/build/ffmpeg-android-${{ matrix.abi }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Android NDK ${{ matrix.ndk }}
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ matrix.ndk }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build make perl nasm pkg-config zlib1g-dev
          cmake --version
          ninja --version

      - name: Build trimmed Android FFmpeg
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          python3 scripts/build-ffmpeg.py \
            --android-ndk "$ANDROID_NDK_HOME" \
            --android-abi "${{ matrix.abi }}" \
            --android-api "${{ inputs.android_api }}" \
            --ffmpeg-version "${{ inputs.ffmpeg_version }}" \
            --prefix "$FFMPEG_ROOT" \
            --jobs "$(nproc)" \
            2>&1 | tee "ffmpeg-${{ matrix.ndk }}-${{ matrix.abi }}.log"

      - name: Configure and build caudio
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          python3 scripts/configure.py android \
            --ndk "$ANDROID_NDK_HOME" \
            --android-abi "${{ matrix.abi }}" \
            --android-api "${{ inputs.android_api }}" \
            --ffmpeg-root "$FFMPEG_ROOT" \
            --build-dir "$BUILD_DIR" \
            --jobs "$(nproc)" \
            --build \
            2>&1 | tee "caudio-${{ matrix.ndk }}-${{ matrix.abi }}.log"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.ndk }}-${{ matrix.abi }}-logs
          path: |
            ffmpeg-${{ matrix.ndk }}-${{ matrix.abi }}.log
            caudio-${{ matrix.ndk }}-${{ matrix.abi }}.log
            ${{ env.BUILD_DIR }}/CMakeCache.txt
          if-no-files-found: warn
