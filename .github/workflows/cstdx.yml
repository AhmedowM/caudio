name: cstdx

# Continuous integration for the standalone cstdx library. caudio itself has
# its own workflow; this one only runs when cstdx (or the root wiring) changes.

on:
  push:
    paths:
      - 'libs/cstdx/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cstdx.yml'
  pull_request:
    paths:
      - 'libs/cstdx/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cstdx.yml'
  workflow_dispatch:
    inputs:
      long_fuzz:
        description: 'Run the 1-hour libFuzzer soak (opt-in, not part of PRs)'
        type: boolean
        default: false

concurrency:
  group: cstdx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CMAKE_VERSION: 3.28.3

jobs:
  # -------------------------------------------------------------------------
  # Linux, GCC 14+. Debug and Release. One debug slice flips char signedness,
  # which catches the base64 class of bug.
  # -------------------------------------------------------------------------
  linux-gcc:
    name: Linux GCC ${{ matrix.build_type }} ${{ matrix.char_signedness }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            char_signedness: signed
            c_flags: ''
          - build_type: Debug
            char_signedness: unsigned
            c_flags: '-funsigned-char'
          - build_type: Release
            char_signedness: signed
            c_flags: ''
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 ninja-build cmake libasan8 libubsan1

      - name: Configure
        env:
          CFLAGS: ${{ matrix.c_flags }}
        run: |
          cmake -S libs/cstdx -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_FLAGS="$CFLAGS -Werror"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # -------------------------------------------------------------------------
  # Clang 19+ with ASan + UBSan. The whole test suite runs under sanitizers.
  # -------------------------------------------------------------------------
  linux-clang-sanitizers:
    name: Linux Clang ASan+UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 lld-19 ninja-build cmake libclang-rt-19-dev clang-tools-19 libasan8 libubsan1

      - name: Configure
        run: |
          cmake -S libs/cstdx -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCSTDX_SANITIZERS=address,undefined

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  # -------------------------------------------------------------------------
  # C++23 differential/property tests against the STL. GoogleTest and
  # RapidCheck are fetched by the test CMakeLists.
  # -------------------------------------------------------------------------
  cpp-differential:
    name: C++23 differential (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 ninja-build cmake

      - name: Configure
        run: |
          cmake -S libs/cstdx -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCSTDX_BUILD_CPP_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # -------------------------------------------------------------------------
  # Source-based coverage with llvm-cov. Reports line and branch coverage for
  # the cstdx library (test-side code is excluded), publishes an HTML report,
  # and uploads the summary. COVERAGE_MIN_LINES / COVERAGE_MIN_BRANCHES act as
  # ratchets: the job fails if line or branch coverage drops below the floor.
  # Pull requests additionally gate on coverage of changed lines.
  # -------------------------------------------------------------------------
  coverage:
    name: llvm-cov coverage (Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COVERAGE_MIN_LINES: '80'
      COVERAGE_MIN_BRANCHES: '70'
      LLVM_COV: llvm-cov-19
      LLVM_PROFDATA: llvm-profdata-19
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover needs the PR base branch to compute the changed lines.
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 llvm-19 llvm-19-tools ninja-build cmake libclang-rt-19-dev \
            python3-venv

      - name: Configure
        working-directory: libs/cstdx
        env:
          CC: clang-19
          CXX: clang++-19
        run: cmake --preset coverage

      - name: Build
        working-directory: libs/cstdx
        run: cmake --build --preset coverage --parallel

      - name: Test with coverage
        working-directory: libs/cstdx
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/coverage/profiles/%p-%m.profraw
        run: |
          mkdir -p "${{ github.workspace }}/coverage/profiles"
          ctest --preset coverage

      - name: Report coverage
        working-directory: libs/cstdx
        run: |
          report="${{ github.workspace }}/coverage/report"
          mkdir -p "$report"
          "$LLVM_PROFDATA" merge -sparse \
            "${{ github.workspace }}"/coverage/profiles/*.profraw \
            -o "${{ github.workspace }}/coverage/cstdx.profdata"
          library=$(find build/coverage -name 'libcstdx.so' -print -quit)
          "$LLVM_COV" report "$library" \
            -instr-profile="${{ github.workspace }}/coverage/cstdx.profdata" \
            -ignore-filename-regex='(^|/)tests/' | tee "$report/summary.txt"
          "$LLVM_COV" export "$library" \
            -instr-profile="${{ github.workspace }}/coverage/cstdx.profdata" \
            -ignore-filename-regex='(^|/)tests/' > "$report/coverage.json"
          "$LLVM_COV" export "$library" \
            -instr-profile="${{ github.workspace }}/coverage/cstdx.profdata" \
            -ignore-filename-regex='(^|/)tests/' -format=lcov \
            > "$report/coverage.lcov"
          # diff-cover matches report paths against the git diff, so make the
          # absolute lcov paths relative to the repository root.
          sed "s|^SF:${GITHUB_WORKSPACE}/|SF:|" "$report/coverage.lcov" \
            > "$report/coverage-rel.lcov"
          "$LLVM_COV" show "$library" \
            -instr-profile="${{ github.workspace }}/coverage/cstdx.profdata" \
            -ignore-filename-regex='(^|/)tests/' \
            -format=html -output-dir="$report/html" -show-branches=count
          python3 - "$report/coverage.json" <<'PY'
          import json, os, sys

          report = json.load(open(sys.argv[1],
                                  encoding="utf-8-sig"))["data"][0]
          totals = report["totals"]

          print(f"{'metric':<10} {'covered':>8} {'total':>8} {'percent':>8}")
          for key in ("functions", "regions", "lines", "branches"):
              item = totals[key]
              print(f"{key:<10} {item['covered']:>8} {item['count']:>8} "
                    f"{item['percent']:>7.2f}%")

          checks = (("lines", "COVERAGE_MIN_LINES"),
                    ("branches", "COVERAGE_MIN_BRANCHES"))
          failed = False
          for key, env in checks:
              pct = float(totals[key]["percent"])
              minimum = float(os.environ.get(env, "0"))
              print(f"{key}: {pct:.2f}% (minimum {minimum:.2f}%)")
              if minimum > 0 and pct < minimum:
                  failed = True

          summary = [
              "## cstdx coverage",
              "",
              "| Metric | Covered | Total | Percent |",
              "|---|---:|---:|---:|",
          ]
          for key in ("functions", "regions", "lines", "branches"):
              item = totals[key]
              summary.append(f"| {key.capitalize()} | {item['covered']} | "
                             f"{item['count']} | {item['percent']:.2f}% |")

          worst = []
          for file in report["files"]:
              branches = file["summary"]["branches"]
              if branches["count"] == 0:
                  continue
              name = file["filename"].replace("\\", "/")
              index = name.find("/libs/cstdx/")
              if index >= 0:
                  name = name[index + 1:]
              worst.append((branches["percent"], name,
                            file["summary"]["lines"]["percent"]))
          worst.sort()
          summary.extend(["", "### Lowest branch coverage", "",
                          "| File | Branches | Lines |", "|---|---:|---:|"])
          for percent, name, line_percent in worst[:10]:
              summary.append(
                  f"| `{name}` | {percent:.2f}% | {line_percent:.2f}% |")

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(summary) + "\n")

          sys.exit(1 if failed else 0)
          PY

      - name: Diff coverage (changed lines)
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          DIFF_COVER_MIN: '90'
        run: |
          python3 -m venv .venv-diff-cover
          .venv-diff-cover/bin/pip install --quiet diff-cover
          status=0
          .venv-diff-cover/bin/diff-cover \
            coverage/report/coverage-rel.lcov \
            --compare-branch="origin/${{ github.base_ref }}" \
            --include 'libs/cstdx/**' \
            --fail-under="$DIFF_COVER_MIN" \
            --show-uncovered \
            --format "markdown:coverage/report/diff-cover.md" \
            | tee coverage/report/diff-cover.txt || status=$?
          if [ -f coverage/report/diff-cover.md ]; then
            cat coverage/report/diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cstdx-coverage
          path: |
            coverage/report/summary.txt
            coverage/report/coverage.json
            coverage/report/coverage.lcov
            coverage/report/diff-cover.txt
            coverage/report/diff-cover.md
            coverage/report/html

  # -------------------------------------------------------------------------
  # libFuzzer smoke run. Long runs are opt-in from the Actions tab; CI does a
  # short bounded run so a regression is caught without blocking PRs for
  # minutes.
  # -------------------------------------------------------------------------
  fuzz-smoke:
    name: libFuzzer smoke (Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 ninja-build cmake libclang-rt-19-dev clang-tools-19 libasan8 libubsan1

      - name: Configure
        run: |
          cmake -S libs/cstdx -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCSTDX_BUILD_FUZZ=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Fuzz smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build -L fuzz --output-on-failure

  # -------------------------------------------------------------------------
  # Opt-in 1-hour libFuzzer soak. Trigger it from the Actions tab by enabling
  # the "long_fuzz" workflow_dispatch input; push/PR runs never include it.
  # Each target gets 20 minutes (3 x 20 = 60 minutes total).
  # -------------------------------------------------------------------------
  fuzz-long:
    name: libFuzzer 1-hour soak (Clang, opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.long_fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 ninja-build cmake libclang-rt-19-dev clang-tools-19 libasan8 libubsan1

      - name: Configure
        run: |
          cmake -S libs/cstdx -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCSTDX_BUILD_FUZZ=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Fuzz for one hour total
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mkdir -p fuzz-artifacts
          for target in base64 string vector; do
            ./build/bin/fuzz_${target} fuzz-artifacts/corpus-${target} \
              -max_total_time=1200 -print_final_stats=1 \
              -artifact_prefix=fuzz-artifacts/${target}-
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cstdx-fuzz-artifacts
          path: fuzz-artifacts
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # macOS, AppleClang 16+ (Xcode 16 on macos-15). Debug and Release.
  # -------------------------------------------------------------------------
  macos:
    name: macOS ${{ matrix.build_type }}
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain version
        run: |
          cmake --version
          clang --version

      - name: Configure
        run: |
          cmake -S libs/cstdx -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # -------------------------------------------------------------------------
  # Windows via MSYS2. Both MinGW-w64 GCC and the Clang/LLVM toolchain.
  # Debug and Release per toolchain.
  # -------------------------------------------------------------------------
  windows-msys2:
    name: Windows ${{ matrix.msystem }} ${{ matrix.build_type }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            package_prefix: mingw-w64-x86_64
            cc_package: gcc
            cxx_package: gcc
            cc_binary: gcc
            cxx_binary: gcc
            build_type: Debug
          - msystem: MINGW64
            package_prefix: mingw-w64-x86_64
            cc_package: gcc
            cxx_package: gcc
            cc_binary: gcc
            cxx_binary: gcc
            build_type: Release
          - msystem: CLANG64
            package_prefix: mingw-w64-clang-x86_64
            cc_package: clang
            cxx_package: clang
            cc_binary: clang
            cxx_binary: clang++
            build_type: Debug
          - msystem: CLANG64
            package_prefix: mingw-w64-clang-x86_64
            cc_package: clang
            cxx_package: clang
            cc_binary: clang
            cxx_binary: clang++
            build_type: Release
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel
            ${{ matrix.package_prefix }}-cmake
            ${{ matrix.package_prefix }}-ninja
            ${{ matrix.package_prefix }}-${{ matrix.cc_package }}
            ${{ matrix.package_prefix }}-${{ matrix.cxx_package }}

      - name: Configure
        run: |
          cmake -S libs/cstdx -B build -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.cc_binary }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx_binary }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: |
          export PATH="$PWD/build/bin:$PATH"
          ctest --test-dir build --output-on-failure

  # -------------------------------------------------------------------------
  # Public headers must be self-contained as both C23 and C++23.
  # -------------------------------------------------------------------------
  headers:
    name: Headers ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-14
            cxx: g++-14
          - compiler: clang-19
            cxx: clang++-19
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 clang-19 ninja-build cmake clang-tools-19

      - name: Configure
        run: |
          cmake -S libs/cstdx -B build -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build header smoke targets
        run: cmake --build build --parallel --target cstdx_headers_c cstdx_headers_cpp

      - name: Run header smoke targets
        run: |
          ./build/tests/headers/cstdx_headers_c
          ./build/tests/headers/cstdx_headers_cpp

  # -------------------------------------------------------------------------
  # Standalone install + export. A separate consumer project must find the
  # installed package as cstdx::cstdx and link it.
  # -------------------------------------------------------------------------
  install-export:
    name: Install and export
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 ninja-build cmake

      - name: Build and install cstdx
        run: |
          cmake -S libs/cstdx -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build --parallel
          cmake --install build

      - name: Build a consumer with find_package
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(cstdx_consumer LANGUAGES C)
          set(CMAKE_C_STANDARD 23)
          set(CMAKE_C_STANDARD_REQUIRED ON)
          find_package(cstdx CONFIG REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE cstdx::cstdx)
          EOF
          cat > consumer/main.c <<'EOF'
          #include <cstdx/string.h>

          #include <string.h>

          int main(void) {
              cx_string *text = nullptr;

              if (cx_string_from(&text, "installed", nullptr) != CX_OK) {
                  return 1;
              }

              int failed = strcmp(cx_string_cstr(text), "installed") != 0;

              cx_string_destroy(&text);
              return failed;
          }
          EOF

          cmake -S consumer -B consumer/build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build consumer/build --parallel
          ./consumer/build/consumer

  # -------------------------------------------------------------------------
  # The caudio root build adds cstdx with add_subdirectory. This proves the
  # in-tree wiring still configures, builds, and runs the cstdx tests.
  # -------------------------------------------------------------------------
  monorepo-layout:
    name: caudio root layout
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 ninja-build cmake

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCAUDIO_ENABLE_CCACHE=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
